const APP_VERSION = 'V1.0';
const APP_NAME = '適才適所人才測評系統';
const COLLECT_EMAIL = 'janson168@gmail.com';   // 註冊資料回傳信箱（FormSubmit 表單服務）

let REG_TYPE = 'company';

/* ── 授權（與 ERP Suite 同體系：相容 ERP/HR 金鑰）── */
const LICENSE_SECRET = "Taiwan…Claw";
const PRODUCT_CODES = [1, 2];
const TIER_NAMES = { 1:'免費版', 2:'專業版', 3:'企業版' };
function isFree(){ return STATE.license && STATE.license.tier === 1; }
function candLimit(){ return isFree() ? 20 : null; }

async function verifyLicenseAsync(key, company) {
  if (!key || !company) return { valid:false, reason:'請輸入金鑰與公司名稱' };
  const parts = key.trim().split('-');
  if (parts.length !== 4) return { valid:false, reason:'金鑰格式錯誤（XXXX-XXXX-XXXX-XXXX）' };
  const h = (parts[0] + parts[1] + parts[2]).toUpperCase();
  const expiry = parts[3];
  for (const CODE of PRODUCT_CODES) {
    for (let tier = 1; tier <= 3; tier++) {
      const body = new TextEncoder().encode(`${CODE}|${tier}|${company}|${expiry}|${LICENSE_SECRET}`);
      const hashBuffer = await crypto.subtle.digest('SHA-256', body);
      const hex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
      if (hex.startsWith(h)) {
        if (expiry !== '999999') {
          const ed = new Date(parseInt('20' + expiry.slice(0, 2)), parseInt(expiry.slice(2, 4)) - 1, parseInt(expiry.slice(4, 6)));
          if (new Date() > ed) return { valid:false, reason:'授權已過期（' + ed.toLocaleDateString('zh-TW') + '）' };
        }
        return { valid:true, tier, tierName:TIER_NAMES[tier], company, key, expiry: expiry === '999999' ? '永久' : expiry };
      }
    }
  }
  return { valid:false, reason:'金鑰無效，請確認金鑰與公司名稱正確' };
}

/* ── IndexedDB ── */
const DB_NAME = 'HR_ASSESS_DB', DB_VERSION = 1;
const STORES = ['candidates','draft','license','profile'];
let _db = null;
function openDB(){ return new Promise((res, rej) => { if (_db) return res(_db); const rq = indexedDB.open(DB_NAME, DB_VERSION); rq.onupgradeneeded = e => { const db = e.target.result; for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath:'id' }); }; rq.onsuccess = e => { _db = e.target.result; res(_db); }; rq.onerror = e => rej(e.target.error); }); }
async function dbLoad(store){ const db = await openDB(); return new Promise(res => { const rq = db.transaction(store, 'readonly').objectStore(store).getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]); }); }
async function dbSave(store, data){ const db = await openDB(); return new Promise(res => { const tx = db.transaction(store, 'readwrite'); const os = tx.objectStore(store); os.clear(); (data || []).forEach(d => os.put(d)); tx.oncomplete = () => res(); }); }
async function load(k, f){ try { const d = await dbLoad(k); if (d && d.length > 0) return d; } catch (e) {} try { const v = localStorage.getItem('assess_' + k); if (v) { const d = JSON.parse(v); if (d && d.length > 0) { await dbSave(k, d); localStorage.removeItem('assess_' + k); return d; } } } catch (e) {} return f; }
async function save(k, d){ try { await dbSave(k, d); } catch (e) {} }

/* ═══ 計分引擎 ═══ */
function facetScores(b5) {
  const raw = { O:0, C:0, E:0, A:0, N:0 };
  B5_ITEMS.forEach((it, i) => {
    const v = b5[i] || 3;
    raw[it.f] += it.pos ? v : (6 - v);
  });
  const out = {};
  for (const f of ['O','C','E','A','N']) out[f] = Math.round((raw[f] - 6) / 24 * 100);
  return out;
}
function facetLevel(v){ return v >= 70 ? '高' : (v >= 40 ? '中' : '低'); }
function facetColor(v){ return v >= 70 ? '#166534' : (v >= 40 ? '#b45309' : '#b91c1c'); }
function valueScores(vals) {
  const out = {};
  for (const k of Object.keys(VALUE_NAMES)) out[k] = 0;
  VALUE_ITEMS.forEach((it, i) => { out[it.v] += vals[i] || 3; });
  return out;
}
function topValues(vals) {
  const s = valueScores(vals);
  return Object.entries(s).sort((a, b) => b[1] - a[1]).slice(0, 3)
    .map(([k, v]) => VALUE_NAMES[k]);
}
function sjtScore(ans) {
  let s = 0; const detail = [];
  SJT_ITEMS.forEach((it, i) => {
    const sc = it.scores[ans[i] ?? 0] ?? 0;
    s += sc; detail.push({ q:i + 1, sc });
  });
  return { raw:s, pct: Math.round(s / 16 * 100), detail };
}
function attScore(ans) {
  let s = 0;
  ATT_ITEMS.forEach((it, i) => { const v = ans[i] || 2; s += it.pos ? v : (5 - v); });
  return { raw:s, pct: Math.round((s - 8) / 24 * 100) };
}
function consistencyFlags(b5) {
  const flags = [];
  for (const [a, b] of CONSISTENCY_PAIRS) {
    if (Math.abs((b5[a] || 3) + (b5[b] || 3) - 6) > 1) flags.push([a, b]);
  }
  return flags;
}
function matchPosition(facets, sjtPct, attPct, tpl) {
  let s = 0, w = 0; const parts = {};
  for (const f of ['O','C','E','A','N']) {
    const p = tpl.fit[f];
    const dev = Math.abs(facets[f] - p.i);
    const sc = Math.max(0, Math.round(100 - dev / p.t * 50));
    parts[f] = sc; s += sc * p.w; w += p.w;
  }
  let base = Math.round(s / w);
  const pens = [];
  if (sjtPct < 40) { base -= 10; pens.push('情境判斷偏低（−10）'); }
  if (attPct < 40) { base -= 10; pens.push('工作態度偏低（−10）'); }
  return { score: Math.max(0, Math.min(100, base)), parts, pens };
}
function matchAll(cand) {
  return POSITIONS.map(tpl => ({ key:tpl.key, name:tpl.name, ...matchPosition(cand.facets, cand.sjtPct, cand.attPct, tpl) }))
    .sort((a, b) => b.score - a.score);
}
function bandOf(sc) {
  if (sc >= 75) return { t:'高適配', cls:'badge-success' };
  if (sc >= 60) return { t:'可考慮', cls:'badge-info' };
  if (sc >= 45) return { t:'謹慎評估', cls:'badge-warning' };
  return { t:'不建議', cls:'badge-danger' };
}
function probeQuestions(cand, positionKey) {
  const tpl = POSITIONS.find(p => p.key === positionKey) || POSITIONS[0];
  const probes = [];
  const bank = {

    SJT:'（情境判斷待加強）針對測驗中處理不佳的情境，請應徵者現場模擬一次處理方式，觀察臨場反應。',
    ATT:'（工作態度待確認）請舉例說明你對「沒人檢查也照規定做」的看法與實際經驗。',
  };

  }
  Devs.sort((a, b) => b.abs - a.abs).slice(0, 3).forEach(d => {
    const hi = d.dev > 0;
    const k = d.f + (hi ? '_h' : '_l');
    const pp = tpl.fit[d.f];
    if (bank[k]) probes.push({ color: facetColor(cand.facets[d.f]), text: `${FACET_NAMES[d.f]} ${cand.facets[d.f]}（理想 ${pp.i}）：` + bank[k] });
  });
  if (cand.sjtPct < 60) probes.push({ color:'#b91c1c', text: bank.SJT });
  if (cand.attPct < 60) probes.push({ color:'#b91c1c', text: bank.ATT });
  probes.push({ color:'#1d4ed8', text: bank.V });
  return probes.slice(0, 5);
}
function redFlags(cand) {
  const out = [];
  if (cand.facets.N < 30) out.push({ color:'#b91c1c', text:'情緒穩定偏低：面談請多關懷壓力因應與近期狀態；此指標不可單獨作為排除依據。' });

  if (cand.consist.length >= 2) out.push({ color:'#92400e', text:'作答一致性待確認：有多組反向題回答矛盾，建議擇期重測或面談釐清。' });
  return out;
}

function finalizeCandidate(d) {
  const facets = facetScores(d.b5);

    id: genId(), name: d.name, position: d.position, date: d.date,
    created: new Date().toISOString().slice(0, 10),

  };
  const all = matchAll(cand);
  cand.topMatch = all[0];
  return cand;
}

/* ═══ 示範資料 ═══ */
function genB5(t) {
  // 依各構面目標分反推 6 題作答（貢獻和＝目標原始分），跨構面旋轉分配以產生作答變異
  const out = Array(30).fill(3);
  ['O','C','E','A','N'].forEach((f, fi) => {
    const targetRaw = Math.round(6 + 0.24 * t[f]);
    const per = Math.floor(targetRaw / 6), rem = targetRaw - per * 6;
    const contribs = [per, per, per, per, per, per];
    for (let k = 0; k < rem; k++) contribs[k]++;
    for (let k = 0; k < fi; k++) contribs.push(contribs.shift()); // rotate by facet index
    let n = 0;
    B5_ITEMS.forEach((it, i) => {
      if (it.f !== f) return;
      const v = contribs[n];
      out[i] = it.pos ? v : 6 - v;
      n++;
    });
  });
  return out;
}
function genVals(t) {
  return VALUE_ITEMS.map((it, i) => Math.max(1, Math.min(5, Math.round(t[it.v] / 20) + [0, -1][i % 2])));
}

function fmtMoney(n){ return Number(n).toLocaleString('zh-TW'); }
function genId(){ return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6); }
function esc(s){ return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function posName(k){ const p = POSITIONS.find(x => x.key === k); return p ? p.name : '未指定'; }
function radarSVG(facets, size) {
  const keys = ['O','C','E','A','N'], labels = keys.map(k => FACET_NAMES[k]);
  const W = size || 240, cx = W / 2, cy = W / 2 + 4, R = W / 2 - 34;
  const ang = i => -Math.PI / 2 + i * (2 * Math.PI / 5);
  const ring = k => keys.map((f, i) => `${(cx + R * k / 100 * Math.cos(ang(i))).toFixed(1)},${(cy + R * k / 100 * Math.sin(ang(i))).toFixed(1)}`).join(' ');
  let s = `<svg viewBox="0 0 ${W} ${W + 6}" style="width:${W}px;max-width:100%;display:block;margin:0 auto;">`;
  for (const k of [25, 50, 75, 100]) s += `<polygon points="${ring(k)}" fill="none" stroke="#e7e5e4"/>`;
  keys.forEach((f, i) => { s += `<line x1="${cx}" y1="${cy}" x2="${(cx + R * Math.cos(ang(i))).toFixed(1)}" y2="${(cy + R * Math.sin(ang(i))).toFixed(1)}" stroke="#e7e5e4"/>`; });
  const pts = keys.map((f, i) => { const r = R * facets[f] / 100; return `${(cx + r * Math.cos(ang(i))).toFixed(1)},${(cy + r * Math.sin(ang(i))).toFixed(1)}`; }).join(' ');
  s += `<polygon points="${pts}" fill="rgba(180,83,9,0.18)" stroke="#b45309" stroke-width="2"/>`;
  keys.forEach((f, i) => { const r = R * facets[f] / 100; s += `<circle cx="${(cx + r * Math.cos(ang(i))).toFixed(1)}" cy="${(cy + r * Math.sin(ang(i))).toFixed(1)}" r="3" fill="#b45309"/>`; });
  keys.forEach((f, i) => {
    const lx = cx + (R + 17) * Math.cos(ang(i)), ly = cy + (R + 17) * Math.sin(ang(i));
    const anchor = Math.abs(Math.cos(ang(i))) < .3 ? 'middle' : (Math.cos(ang(i)) > 0 ? 'start' : 'end');
    s += `<text x="${lx.toFixed(1)}" y="${(ly + 1).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="#1c1917">${labels[i]} ${facets[f]}</text>`;
  });
  s += '</svg>';
  return s;
}
function facetBars(facets) {
  return ['O','C','E','A','N'].map(f => {
    const v = facets[f];
    return `<div class="facbar"><span>${FACET_NAMES[f]}</span>
      <div class="bar"><div style="width:${v}%;background:${facetColor(v)};"></div></div>
      <span class="num" style="color:${facetColor(v)};font-weight:700;">${v} ${facetLevel(v)}</span></div>`;
  }).join('');
}
function expXLSX(data, fn) {
  if (typeof XLSX === 'undefined') { alert('Excel 元件尚未載入（需網路載入 SheetJS）。'); return; }

  const ws = XLSX.utils.json_to_sheet(data);

}

    <div>${topValues(c.vals).map((v, i) => `<span class="badge ${i === 0 ? 'badge-success' : 'badge-info'}" style="margin-right:8px;padding:4px 12px;">${i + 1}. ${v}</span>`).join('')}
    <span style="font-size:12px;color:var(--text-muted);margin-left:6px;">面談時可確認工作誘因是否與職務條件相符</span></div></div>`;
  h += `<div class="report-section"><h3>八大職務適配排序</h3><table class="data-table">
    <thead><tr><th>排名</th><th>職位</th><th class="num">適配分</th><th>評等</th><th>說明</th></tr></thead><tbody>`;
  matches.forEach((m, i) => {
    const b = bandOf(m.score);
    h += `<tr${m.key === c.position ? ' style="background:#fdf6ee;"' : ''}><td class="num">${i + 1}${m.key === c.position ? ' ←應徵' : ''}</td><td>${esc(m.name)}</td>
      <td class="num" style="font-weight:700;">${m.score}</td><td><span class="match-band ${b.cls}">${b.t}</span></td>
      <td style="font-size:11.5px;color:var(--text-muted);">${esc(POSITIONS.find(p => p.key === m.key).desc)}</td></tr>`;
  });
  h += `</tbody></table></div>`;
  h += `<div class="report-section"><h3>面談追問建議（依適配落差自動產生）</h3>
    ${probes.map(p => `<div class="probe"><span class="dot" style="background:${p.color};"></span><span>${esc(p.text)}</span></div>`).join('')}</div>`;
  if (flags.length) {
    h += `<div class="report-section"><h3>注意事項</h3>${flags.map(f => `<div class="probe"><span class="dot" style="background:${f.color};"></span><span>${esc(f.text)}</span></div>`).join('')}</div>`;
  }
  h += `<div class="disclaim">本報告由「${APP_NAME}」自動產生，僅供招募輔助參考，不得作為錄用與否之唯一依據，不得用於心理疾病診斷。測驗結果涉及個人資料，請依個人資料保護相關規定保管，並於招募程序結束後依規定處理。就業服務法第 5 條禁止就業歧視——請以職務相關能力綜合評估。</div>`;
  h += `<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;" class="no-print">
    <button class="btn btn-outline" onclick="printReport('${c.id}')">🖨️ 列印報告</button>
    <button class="btn btn-primary" onclick="closeModal()">關閉</button></div></div>`;
  document.getElementById('modalBox').innerHTML = h;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal(){ document.getElementById('modalOverlay').classList.add('hidden'); STATE.editingId = null; }

function printReport(id) {
  const c = getCand(id); if (!c) return;
  const matches = matchAll(c);
  const w = window.open('', '_blank', 'width=900,height=900');
  let h = '<html><head><meta charset="UTF-8"><title>測評報告 — ' + esc(c.name) + '</title><style>body{font-family:"Noto Sans TC",sans-serif;padding:24px;color:#111;font-size:13px;line-height:1.7}h2{color:#1c1917;border-bottom:2px solid #333;padding-bottom:6px}table{border-collapse:collapse;width:100%;font-size:12px;margin:8px 0}th,td{border:1px solid #999;padding:6px 9px}th{background:#f0ede9;text-align:left}td.n{text-align:right}.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #b45309;padding-bottom:10px;margin-bottom:6px}.hd .t{font-size:20px;font-weight:900}.hd .b{font-size:11px;color:#666}.sm{font-size:11px;color:#666}</style></head><body>';
  h += '<div class="hd"><div><div class="t">適才適所測評報告</div><div class="b">' + esc(c.name) + '｜應徵：' + esc(posName(c.position)) + '｜施測日：' + esc(c.date) + (PROFILE ? '｜使用單位：' + esc(PROFILE.name) : '') + '</div></div><div class="b">erp-free.com · 適才適所人才測評系統 V1.0</div></div>';
  h += '<h2>五大人格工作特質</h2><table><tr><th>構面</th><th>分數</th><th>強度</th><th>說明</th></tr>';
  for (const f of ['O','C','E','A','N']) h += `<tr><td>${FACET_NAMES[f]}</td><td class="n">${c.facets[f]}</td><td>${facetLevel(c.facets[f])}</td><td class="sm">${({O:'嘗試新方法與學習意願',C:'可靠性、紀律與細節',E:'人際互動與表達活力',A:'合作、體諒與衝突處理',N:'抗壓與情緒平穩'})[f]}</td></tr>`;
  h += '</table>';
  h += '<h2>輔助指標</h2><table><tr><th>項目</th><th class="n">分數</th><th>說明</th></tr>';
  h += `<tr><td>情境判斷（SJT 8 題）</td><td class="n">${c.sjtPct}</td><td class="sm">實務判斷力：客訴、衝突、多工、誠信、保密、安全</td></tr>`;
  h += `<tr><td>誠信與工作態度</td><td class="n">${c.attPct}</td><td class="sm">自律、守規、負責傾向</td></tr>`;
  h += `<tr><td>主要工作動機</td><td class="n">—</td><td class="sm">${esc(topValues(c.vals).join('、'))}</td></tr>`;
  h += `<tr><td>作答一致性</td><td class="n">${c.consist.length}</td><td class="sm">${c.consist.length >= 2 ? '多組反向題矛盾，建議重測或面談釐清' : '正常'}</td></tr></table>`;
  h += '<h2>八大職務適配排序</h2><table><tr><th>職位</th><th class="n">適配分</th><th>評等</th></tr>';
  matches.forEach(m => { h += `<tr><td>${esc(m.name)}${m.key === c.position ? '（應徵職位）' : ''}</td><td class="n">${m.score}</td><td>${bandOf(m.score).t}</td></tr>`; });
  h += '</table>';
  h += '<p class="sm">※ 本報告僅供招募輔助參考，不得作為錄用唯一依據；不得用於心理疾病診斷；請依個人資料保護規定保管。就業服務法第 5 條禁止就業歧視。</p>';
  h += '</body></html>';
  w.document.write(h);
  w.document.close();
  setTimeout(() => w.print(), 500);
}
async function deleteCand(id) {
  if (!confirm('確定刪除此候選人測評資料？')) return;
  CANDS = CANDS.filter(c => c.id !== id);
  await save('candidates', CANDS);
  renderPage();
}
function exportCandidates() {
  const d = CANDS.map(c => {
    const all = matchAll(c);
    return { 姓名:c.name, 應徵職位:posName(c.position), 施測日:c.date,
      開放學習:c.facets.O, 盡責自律:c.facets.C, 人際活力:c.facets.E, 團隊親和:c.facets.A, 情緒穩定:c.facets.N,
      情境判斷:c.sjtPct, 工作態度:c.attPct, 主要動機:topValues(c.vals).join('、'),
      最適職位:all[0].name, 最適分數:all[0].score, 應徵職位適配:(all.find(m => m.key === c.position) || {}).score ?? '', 一致性:c.consist.length >= 2 ? '待確認' : '正常' };
  });
  expXLSX(d, '人才測評總表');
}

function renderModel() {

    h += `<tr><td><strong>${p.name}</strong></td>`;
    for (const f of ['O','C','E','A','N']) h += `<td class="num">${p.fit[f].i}</td>`;
    h += `<td style="font-size:12px;color:var(--text-muted);">${p.desc}</td></tr>`;

  return h;
}

/* ═══ init ═══ */
(async function init() {
  try {
    await openDB();
    CANDS = await load('candidates', []);
    if (CANDS.length === 0) { CANDS = makeDemoCandidates(); await save('candidates', CANDS); }
    const saved = await load('license', []);
    if (saved && saved.length > 0) {
      const l = saved[0];
      if (l.tier === 1 || (l.key && l.key.startsWith('FREE'))) STATE.license = { valid:true, tier:1, tierName:'免費版', company:l.company || '免費試用', expiry:'永久' };
      else { const r = await verifyLicenseAsync(l.key, l.company); STATE.license = r.valid ? r : null; }
    }
    const pf = await load('profile', []);
    PROFILE = (pf && pf.length > 0) ? pf[0] : null;
  } catch (e) { CANDS = makeDemoCandidates(); }
  DRAFT = blankDraft();
  const ver = document.getElementById('sidebarVer');
  if (ver) ver.textContent = `${STATE.license ? TIER_NAMES[STATE.license.tier] : '免費版'} ${APP_VERSION}`;
  const lic = document.getElementById('sidebarLicense');
  if (lic) lic.textContent = PROFILE ? PROFILE.name + '｜erp-free.com' : 'erp-free.com';
  renderPage();
})();

  nav(item.dataset.page);
});
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === document.getElementById('modalOverlay')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
setInterval(() => { const el = document.getElementById('sidebarClock'); if (el) el.textContent = new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' }); }, 1000);
setInterval(() => { const el = document.getElementById('headerDate'); if (el) el.textContent = new Date().toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit', weekday:'short' }); }, 1000);
