<style>
:root{
  --bg:#0f141a; --card:#1a222c; --card2:#212b37; --ink:#e8ecf1; --muted:#8b96a3; --line:#2a3441;
  --brand:#4f9cf9; --brand-deep:#3b7fd0; --brand-soft:#16324f;
  --up:#f16a5f; --down:#43c27d; --gold:#f4c542;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit;}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 24px rgba(0,0,0,.5);}
#topbar{position:sticky;top:0;z-index:40;background:#131a22;border-bottom:1px solid var(--line);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;}
#topbar .logo{width:34px;height:34px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:none;}
#topbar .logo svg{width:20px;height:20px;}
#topbar h1{font-size:17px;font-weight:700;}
#topbar .sub{font-size:10.5px;color:var(--muted);margin-top:-2px;}
#topbar .spacer{flex:1;}
.badge-pro{background:var(--gold);color:#3d2f00;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
.badge-free{background:rgba(255,255,255,.12);color:var(--muted);font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;}
#view{flex:1;padding:14px 14px calc(88px + env(safe-area-inset-bottom));}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
.card-h h2{font-size:15px;font-weight:700;}
.card-h .spacer{flex:1;}
.card-b{padding:14px 16px;}
.card-b.p0{padding:0;}
.muted{color:var(--muted);} .small{font-size:12.5px;} .b{font-weight:700;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
.stat .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:2px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#0c1117;outline:none;}
.field textarea{min-height:64px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);}
.row{display:flex;gap:10px;} .row>*{flex:1;}
.seg{display:flex;background:#0c1117;border-radius:10px;padding:3px;gap:3px;}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;}
.seg button.on{background:var(--card2);color:var(--brand);box-shadow:0 0 0 1px var(--line);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14.5px;transition:transform .1s;}
.btn:active{transform:scale(.97);}
.btn-p{background:var(--brand);color:#fff;}
.btn-p2{background:var(--brand-deep);color:#fff;}
.btn-o{border:1.5px solid var(--brand);color:var(--brand);background:transparent;}
.btn-g{background:#0c1117;color:var(--ink);border:1px solid var(--line);}
.btn-d{border:1.5px solid #5e3231;color:var(--up);background:transparent;}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px;}
.btn-full{width:100%;}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:13px;color:var(--muted);font-weight:600;}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);}
.li:last-child{border-bottom:none;}
.li .grow{flex:1;min-width:0;}
.li .t1{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li .t2{font-size:12.5px;color:var(--muted);margin-top:1px;}
.li .amt{font-weight:800;font-variant-numeric:tabular-nums;font-size:14.5px;text-align:right;white-space:nowrap;}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:4px;}
.tag-up{background:rgba(241,106,95,.15);color:var(--up);}
.tag-down{background:rgba(67,194,125,.15);color:var(--down);}
.tag-flat{background:#222c38;color:var(--muted);}
.tag-long{background:rgba(241,106,95,.15);color:var(--up);}
.tag-short{background:rgba(67,194,125,.15);color:var(--down);}
.pos{color:var(--up);} .neg{color:var(--down);}
.disclaim{font-size:11px;color:var(--muted);line-height:1.7;border-top:1px dashed var(--line);margin-top:12px;padding-top:9px;}
.empty{padding:36px 20px;text-align:center;color:var(--muted);}
.empty svg{width:44px;height:44px;opacity:.35;margin-bottom:8px;}
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#131a22;border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom);}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--muted);font-size:11px;font-weight:600;}
#tabbar button svg{width:21px;height:21px;}
#tabbar button.on{color:var(--brand);}
#tabbar .fab{margin-top:-18px;}
#tabbar .fab .disc{width:46px;height:46px;border-radius:999px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(79,156,249,.35);}
#tabbar .fab .disc svg{width:22px;height:22px;}
#modalOverlay{position:fixed;inset:0;background:rgba(5,8,12,.66);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:560px){#modalOverlay{align-items:center;}}
#modalOverlay.hidden{display:none;}
#modalBox{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));}
@media(min-width:560px){#modalBox{border-radius:18px;}}
.modal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.modal-h h3{font-size:16px;font-weight:800;flex:1;}
.modal-h .x{width:30px;height:30px;border-radius:999px;background:#0c1117;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);}
.plan{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;background:var(--card2);}
.plan.feat{border-color:var(--brand);background:var(--brand-soft);}
.plan .pn{font-size:12.5px;color:var(--muted);font-weight:700;}
.plan .pp{font-size:26px;font-weight:800;margin:6px 0;color:var(--brand);font-variant-numeric:tabular-nums;}
.plan .pp span{font-size:12px;color:var(--muted);font-weight:600;}
#toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#e8ecf1;color:#10151a;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:120;max-width:86%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.4);}
#toast.hidden{display:none;}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.prow .d{flex:0 0 86px;font-family:Consolas,monospace;font-size:12.5px;color:var(--muted);}
.prow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#0c1117;text-align:right;font-variant-numeric:tabular-nums;}
.prow .del{width:28px;height:28px;border-radius:8px;background:#0c1117;color:var(--up);display:flex;align-items:center;justify-content:center;font-weight:800;border:1px solid var(--line);flex:none;}
.rangebox{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.rangebox .rb-t{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700;}
.rangebox .rb-v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
.rangebox .rb-s{font-size:11.5px;color:var(--muted);margin-top:2px;}
.monthbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;}
.monthbar .m{flex:0 0 46px;color:var(--muted);font-family:Consolas,monospace;}
.monthbar .bar{flex:1;height:14px;background:#0c1117;border-radius:999px;overflow:hidden;display:flex;justify-content:flex-end;}
.monthbar .bar i{display:block;height:100%;border-radius:999px;}
.monthbar .v{flex:0 0 84px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}
.hero{background:linear-gradient(135deg,#1d3557 0%,#0f1c2e 100%);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px;border:1px solid #2b4a73;}
.hero .h1{font-size:16px;font-weight:800;}
.hero .h2{font-size:12.5px;opacity:.8;margin-top:3px;}
.hero .quota{margin-top:12px;background:rgba(255,255,255,.1);border-radius:10px;padding:9px 12px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;}
.progress{height:6px;background:rgba(255,255,255,.15);border-radius:999px;margin-top:7px;overflow:hidden;}
.progress i{display:block;height:100%;background:var(--gold);border-radius:999px;}
</style>

<script>
"use strict";
/* ═══════════ 台股當沖助手 v1.0.0 — tw.erpfree.twstock ═══════════
   統計計算與交易紀錄工具（離線）｜不提供投資建議
   免費版：2 支股票／每支 5 日／30 筆日誌／無匯出
═════════════════════════════════════════════════════════ */
var APP_VER='1.0.0';
var SKUS=['twstock_pro_monthly','twstock_pro_yearly'];
var SUB_MGMT='https://play.google.com/store/account/subscriptions?sku=twstock_pro_monthly&package=tw.erpfree.twstock';
var FREE_STOCKS=2, FREE_DAYS=5, PRO_DAYS=20, FREE_TRADES=30;
var DISCLAIMER='以上為歷史數據之統計描述與參考區間，不構成投資建議；歷史波動不保證未來走勢，投資均有風險。';

/* ── storage ── */
var DB=null;
function defaultDB(){
  return {
    v:1,
    settings:{capital:200000,riskPct:2,disc:58,lowMin:true,taxDay:0.15},
    stocks:[],trades:[],
    pro:{active:false,product:null,checkedAt:0}
  };
}
function loadDB(){
  try{
    var raw=localStorage.getItem('twstock_db_v1');
    if(raw){DB=JSON.parse(raw);}else{DB=defaultDB();saveDB();}
  }catch(e){DB=defaultDB();}
  if(!DB.pro)DB.pro={active:false,product:null,checkedAt:0};
  if(!DB.settings)DB.settings=defaultDB().settings;
}
function saveDB(){try{localStorage.setItem('twstock_db_v1',JSON.stringify(DB));}catch(e){toast('儲存失敗：本機空間不足');}}

/* ── utils ── */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function money(n){n=Math.round(Number(n)||0);return 'NT$'+n.toLocaleString('en-US');}
function px(n,tick){var t=tick||tickSize(n);var dec=t>=1?0:(t>=0.1?1:2);return (Math.round(n/t)*t).toFixed(dec);}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast._tm);toast._tm=setTimeout(function(){t.classList.add('hidden');},2400);}
/* 台股檔位（2024/04 起千金股 1 元） */
function tickSize(p){if(p<10)return 0.01;if(p<50)return 0.05;if(p<100)return 0.1;if(p<500)return 0.5;return 1;}
function limitUp(c){return px(c*1.1);}
function limitDn(c){return px(c*0.9);}
function tradeDates(n){var out=[],d=new Date();while(out.length<n){var w=d.getDay();if(w!==0&&w!==6)out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));d.setDate(d.getDate()-1);}return out.reverse();}

/* ── 統計 ── */
function closesOf(s){return s.days.map(function(d){return Number(d.close);}).filter(function(x){return x>0;});}
function returnsOf(c){var r=[];for(var i=1;i<c.length;i++){if(c[i-1]>0)r.push(c[i]/c[i-1]-1);}return r;}
function mean(a){var s=0;a.forEach(function(x){s+=x;});return a.length?s/a.length:0;}
function std(a){if(a.length<2)return 0;var m=mean(a),s=0;a.forEach(function(x){s+=(x-m)*(x-m);});return Math.sqrt(s/(a.length-1));}
function slopePct(c){var n=c.length;if(n<3)return 0;var xm=(n-1)/2,ym=mean(c),num=0,den=0;for(var i=0;i<n;i++){num+=(i-xm)*(c[i]-ym);den+=(i-xm)*(i-xm);}if(den===0||ym===0)return 0;return (num/den)/ym;}
function maN(c,n){if(c.length<n)return null;var t=0;for(var i=c.length-n;i<c.length;i++)t+=c[i];return t/n;}
function rsiN(c,n){if(c.length<n+1)return null;var g=0,l=0;for(var i=c.length-n;i<c.length;i++){var d=c[i]-c[i-1];if(d>0)g+=d;else l-=d;}if(g+l===0)return 50;return 100*g/(g+l);}
function analyze(s){
  var c=closesOf(s),out={n:c.length,last:c.length?c[c.length-1]:0};
  var r=returnsOf(c);
  out.sigma=r.length>=2?std(r):null;
  out.slope=c.length>=3?slopePct(c):null;
  out.mom=c.length>=2?(c[c.length-1]/c[0]-1):null;
  out.ma5=maN(c,5);
  out.rsi=rsiN(c,6);
  if(out.slope!==null){out.trend=Math.abs(out.slope)<0.0015?'盤整':(out.slope>0?'上行':'下行');}
  else out.trend=null;
  if(out.sigma!==null){out.base=out.last;out.s1=out.base*out.sigma;out.s2=out.base*out.sigma*2;}
  return out;
}

/* ── pro / billing ── */
var billingService=null;
function openModal(html){$('modalBox').innerHTML=html;$('modalOverlay').classList.remove('hidden');}
function closeModal(){$('modalOverlay').classList.add('hidden');}
function isPro(){return !!(DB.pro&&DB.pro.active);}
function canAddStock(){return isPro()||DB.stocks.length<FREE_STOCKS;}
function canAddTrade(){return isPro()||DB.trades.length<FREE_TRADES;}
function dayCap(){return isPro()?PRO_DAYS:FREE_DAYS;}
async function initBilling(){
  if(!('getDigitalGoodsService' in window)){billingService=null;return;}
  try{billingService=await window.getDigitalGoodsService('play');}catch(e){billingService=null;}
}
async function refreshPlaySub(){
  if(!billingService)return;
  try{
    var ps=await billingService.listPurchases();
    var act=ps.filter(function(p){return SKUS.indexOf(p.productId)>=0&&p.purchaseState==='PURCHASED';});
    for(var i=0;i<act.length;i++){try{await billingService.acknowledge(act[i].purchaseToken,act[i].productId);}catch(e){}}
    DB.pro.active=act.length>0;DB.pro.product=act.length?act[0].productId:null;DB.pro.checkedAt=Date.now();
    saveDB();updateProBadge();
  }catch(e){}
}
async function subscribePlay(sku){
  if(!billingService){toast('此環境不支援 Google Play 訂閱，請於 Google Play 版 App 內訂閱');return;}
  try{
    var details=await billingService.getDetails([sku]);
    if(!details||!details.length){toast('查無此訂閱方案，請確認 Play 商品已建立');return;}
    await billingService.launchPaymentFlow(details[0]);
    await refreshPlaySub();closeModal();toast(isPro()?'訂閱成功，專業版已解鎖':'訂閱流程未完成');render();
  }catch(e){toast('訂閱流程未完成或發生錯誤');}
}

function openStock(id){CUR_STOCK=id;CUR='analysis';render();window.scrollTo(0,0);}
function stockModal(){
  if(!canAddStock()){showPayModal();return;}
  var h='<div class="modal-h"><h3>新增股票</h3><button class="x" onclick="closeModal()">✕</button></div>';
  h+='<div class="row"><div class="field"><label>股票代碼 *</label><input type="text" id="st_code" placeholder="2330" inputmode="numeric"></div><div class="field"><label>名稱 *</label><input type="text" id="st_name" placeholder="台積電"></div></div>';
  h+='<div class="field"><label>近五日收盤價（可貼上，逗號/空白分隔，由舊到新）</label><textarea id="st_closes" placeholder="例：1020, 1015, 1030, 1028, 1042"></textarea></div>';
  h+='<button class="btn btn-p btn-full" onclick="saveStock()">建立</button>';
  openModal(h);
}
function saveStock(){
  var code=$('st_code').value.trim(),name=$('st_name').value.trim();
  if(!code||!name){toast('請填寫代碼與名稱');return;}
  var ds=tradeDates(5),closes=[];
  var raw=($('st_closes').value||'').split(/[\s,，、]+/).filter(Boolean);
  raw.forEach(function(x){var v=Number(x);if(v>0)closes.push(v);});
  if(closes.length===0){toast('請至少輸入收盤價（可之後再補）');return;}
  if(closes.length>dayCap()){closes=closes.slice(0,dayCap());}
  var days=[];
  for(var i=0;i<closes.length;i++){days.push({date:ds[ds.length-closes.length+i]||todayStr(),close:closes[i]});}
  DB.stocks.push({id:uid(),code:code,name:name,days:days});
  saveDB();closeModal();toast('已新增 '+code+' '+name);
  openStock(DB.stocks[DB.stocks.length-1].id);
}

/* ═══ 分析頁 ═══ */
function renderAnalysis(){
  var s=curStock();if(!s)return '<div class="empty">股票不存在</div>';
  var a=analyze(s);
  var h='<div class="card"><div class="card-h"><h2>'+esc(s.code)+'　'+esc(s.name)+'</h2><div class="spacer"></div><button class="btn btn-g btn-sm" onclick="go(\'home\')">返回</button></div><div class="card-b">';
  h+='<div><div class="b" style="font-size:24px;font-variant-numeric:tabular-nums;">'+px(a.last)+'</div><div class="muted small">最近收盤｜'+(a.mom!==null?'近'+a.n+'日 <span class="'+(a.mom>=0?'pos':'neg')+'">'+(a.mom>=0?'+':'')+(a.mom*100).toFixed(2)+'%</span>':'')+'</div></div>';
  h+='<div style="margin-top:14px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><span class="small b">收盤價紀錄（'+s.days.length+'/'+dayCap()+' 日）</span><div style="flex:1;"></div>';
  h+='<button class="btn btn-g btn-sm" onclick="pasteCloses()">貼上</button>';
  if(s.days.length<dayCap())h+='<button class="btn btn-o btn-sm" onclick="addDay()">＋1 日</button>';
  h+='</div><div id="prows">';
  s.days.forEach(function(d,i){
    h+='<div class="prow"><span class="d">'+esc(d.date)+'</span><input type="number" step="any" min="0" value="'+d.close+'" oninput="setClose('+i+',this.value)">';
    if(s.days.length>2)h+='<button class="del" onclick="delDay('+i+')">✕</button>';
    h+='</div>';
  });
  h+='</div>';
  if(!isPro()&&s.days.length>=FREE_DAYS)h+='<div class="small" style="color:var(--gold);margin-top:4px;">免費版每支上限 '+FREE_DAYS+' 日——升級專業版可記 20 日，統計更穩定。 <button class="btn btn-p btn-sm" onclick="showPayModal()">升級</button></div>';
  h+='</div></div></div>';
  h+='<div id="statBox">'+statHtml(s)+'</div>';
  return h;
}
function curStock(){return DB.stocks.find(function(x){return x.id===CUR_STOCK;});}
function setClose(i,v){var s=curStock();s.days[i].close=Math.max(0,Number(v)||0);saveDB();var el=$('statBox');if(el)el.innerHTML=statHtml(s);}
function addDay(){var s=curStock();if(s.days.length>=dayCap()){showPayModal();return;}var ds=tradeDates(s.days.length+1);s.days.push({date:ds[ds.length-1],close:0});saveDB();render();}
function delDay(i){var s=curStock();if(s.days.length<=2){toast('至少保留 2 日');return;}s.days.splice(i,1);saveDB();render();}
function pasteCloses(){
  openModal('<div class="modal-h"><h3>貼上收盤價</h3><button class="x" onclick="closeModal()">✕</button></div><div class="field"><label>由舊到新，逗號／空白／換行分隔（最多 '+dayCap()+' 個）</label><textarea id="pc_text" placeholder="1020, 1015, 1030, 1028, 1042"></textarea></div><button class="btn btn-p btn-full" onclick="doPaste()">套用</button>');
}
function doPaste(){
  var s=curStock();
  var raw=($('pc_text').value||'').split(/[\s,，、]+/).filter(Boolean);
  var vals=[];raw.forEach(function(x){var v=Number(x);if(v>0)vals.push(v);});
  if(vals.length<2){toast('至少需要 2 個價格');return;}
  if(vals.length>dayCap()){vals=vals.slice(0,dayCap());toast('已截取前 '+dayCap()+' 個');}
  var ds=tradeDates(vals.length);
  s.days=vals.map(function(v,i){return {date:ds[i],close:v};});
  saveDB();closeModal();toast('已更新 '+vals.length+' 日');render();
}

  h+='<div class="stat"><div class="v">'+(a.sigma!==null?(a.sigma*100).toFixed(2)+'%':'—')+'</div><div class="l">日波動 σ</div></div>';
  h+='<div class="stat"><div class="v">'+(a.rsi!==null?a.rsi.toFixed(0):'—')+'</div><div class="l">RSI(6)</div></div>';
  h+='</div>';
  if(a.trend)h+='<div style="margin-top:10px;" class="small">趨勢描述：'+trendTag(a.trend)+(a.slope!==null?'　日均斜率 '+(a.slope*100>=0?'+':'')+(a.slope*100).toFixed(2)+'%':'')+'</div>';
  h+='<div class="disclaim">'+DISCLAIMER+'</div>';
  h+='</div></div>';
  if(a.sigma!==null){
    h+='<div class="card"><div class="card-h"><h2>明日統計參考區間</h2></div><div class="card-b">';
    h+='<div class="grid2">';

    h+='<div class="rangebox"><div class="rb-t">±2σ 區間（常態約 95%）</div><div class="rb-v">'+px(a.base-a.s2)+' ~ '+px(a.base+a.s2)+'</div><div class="rb-s">波動放大時的寬區間</div></div>';
    h+='</div>';
    h+='<div class="grid2">';
    h+='<div class="rangebox"><div class="rb-t">漲停價（+10%，依檔位）</div><div class="rb-v pos">'+limitUp(a.base)+'</div></div>';
    h+='<div class="rangebox"><div class="rb-t">跌停價（−10%，依檔位）</div><div class="rb-v neg">'+limitDn(a.base)+'</div></div>';
    h+='</div>';

    h+='<div style="margin-top:12px;"><button class="btn btn-o btn-full" onclick="shareAnalysis()">分享統計卡（圖片）</button></div>';
    h+='<div class="disclaim">'+DISCLAIMER+'</div>';
    h+='</div></div>';
  }

}

/* ── 分享統計卡 ── */
function _f(ctx,size,bold){ctx.font=(bold?'bold ':'')+size+'px "Microsoft JhengHei","PingFang TC","Noto Sans CJK TC","Noto Sans TC",sans-serif';}
function drawAnalysisCard(s){
  var a=analyze(s);
  var W=1200,H=630,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var ctx=cv.getContext('2d');
  var g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1d3557');g.addColorStop(1,'#0f1c2e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#4f9cf9';ctx.fillRect(0,0,W,8);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#e8ecf1';_f(ctx,52,true);ctx.fillText(s.code+'　'+s.name,64,110);
  _f(ctx,22,false);ctx.fillStyle='#8b96a3';ctx.fillText('最近收盤 '+px(a.last)+'　·　'+a.n+' 日統計　·　'+todayStr(),64,152);
  var y=210;
  function item(label,val,color){
    ctx.fillStyle='#8b96a3';_f(ctx,20,false);ctx.fillText(label,64,y);
    ctx.fillStyle=color||'#e8ecf1';_f(ctx,30,true);ctx.fillText(val,380,y);y+=58;
  }
  if(a.ma5!==null)item('5 日均價',px(a.ma5));
  if(a.sigma!==null)item('日波動 σ',(a.sigma*100).toFixed(2)+'%');
  if(a.rsi!==null)item('RSI(6)',a.rsi.toFixed(0));
  if(a.trend)item('趨勢描述',a.trend,a.trend==='上行'?'#f16a5f':a.trend==='下行'?'#43c27d':'#8b96a3');
  if(a.sigma!==null){
    item('±1σ 參考區間',px(a.base-a.s1)+' ~ '+px(a.base+a.s1),'#4f9cf9');
    item('±2σ 參考區間',px(a.base-a.s2)+' ~ '+px(a.base+a.s2),'#4f9cf9');
    item('漲停／跌停',limitUp(a.base)+' ／ '+limitDn(a.base),'#e8ecf1');
  }
  ctx.fillStyle='#8b96a3';_f(ctx,17,false);
  ctx.fillText('統計參考區間，非預測、非投資建議｜台股當沖助手',64,H-38);
  ctx.fillStyle='#f4c542';_f(ctx,17,true);ctx.textAlign='right';ctx.fillText('tw.erpfree.com/twstock/',W-64,H-38);
  return cv;
}
async function shareAnalysis(){
  var s=curStock();if(!s)return;
  toast('產生圖片中…');
  try{
    var cv=drawAnalysisCard(s);
    var blob=await new Promise(function(res){cv.toBlob(res,'image/png');});
    var fname='統計卡_'+s.code+'.png';
    var file=new File([blob],fname,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fname});toast('已開啟分享面板');}
    else{var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=fname;a.click();setTimeout(function(){URL.revokeObjectURL(url);},4000);toast('已下載圖檔');}
  }catch(e){toast('產生圖片失敗');}
}

function refreshTool(){
  var el=$('toolResult');if(!el)return;
  el.innerHTML=TOOL==='pos'?posResultHtml():TOOL==='pnl'?pnlResultHtml():limitResultHtml();
}
var POS={capital:'',risk:'',entry:'',stop:''};
function posFormHtml(){
  var st=DB.settings;
  var h='<div class="row"><div class="field"><label>可動用資金</label><input type="number" step="any" value="'+(POS.capital!==''?POS.capital:st.capital)+'" oninput="POS.capital=this.value;refreshTool()"></div><div class="field"><label>單筆風險 %</label><input type="number" step="any" value="'+(POS.risk!==''?POS.risk:st.riskPct)+'" oninput="POS.risk=this.value;refreshTool()"></div></div>';
  h+='<div class="row"><div class="field"><label>進場價</label><input type="number" step="any" value="'+POS.entry+'" oninput="POS.entry=this.value;refreshTool()"></div><div class="field"><label>停損價</label><input type="number" step="any" value="'+POS.stop+'" oninput="POS.stop=this.value;refreshTool()"></div></div>';
  return h;
}
function posResultHtml(){
  var st=DB.settings;
  var cap=POS.capital!==''?(Number(POS.capital)||0):st.capital, rk=POS.risk!==''?(Number(POS.risk)||0):st.riskPct, en=Number(POS.entry), sp=Number(POS.stop);
  if(!(en>0&&sp>0&&en!==sp))return '<div class="empty"><div>輸入進場價與停損價即可計算</div></div>';
  var rps=Math.abs(en-sp),shares=Math.floor(cap*(rk/100)/rps),cost=shares*en,risk=shares*rps;
  var stopPct=rps/en*100;
  var h='<div class="grid2">';
  h+='<div class="stat"><div class="v">'+shares.toLocaleString()+' 股</div><div class="l">建議部位（' +(shares/1000).toFixed(2)+' 張）</div></div>';
  h+='<div class="stat"><div class="v">'+money(risk)+'</div><div class="l">停損時損失（'+rk+'% 風險）</div></div>';
  h+='<div class="stat"><div class="v">'+money(cost)+'</div><div class="l">動用資金'+(cost>cap?'　<span class="pos">⚠ 超過可動用資金</span>':'')+'</div></div>';
  h+='<div class="stat"><div class="v">'+stopPct.toFixed(2)+'%</div><div class="l">停損幅度'+(stopPct>5?'　<span class="pos">⚠ 偏寬</span>':'')+'</div></div>';
  h+='</div>';
  if(shares===0)h+='<div class="small" style="color:var(--up);margin-top:8px;">計算結果為 0 股——停損點數相對資金與風險%太大，請檢查輸入。</div>';
  h+='<div class="small muted" style="margin-top:8px;">公式：股數 = 資金 × 風險% ÷ 每股停損點數。現股當沖需全額本金；資券當沖的槓桿與風險另計。</div>';

function tradeNet(t){
  var st=DB.settings,disc=t.disc||st.disc;
  var feeRate=0.001425*(disc/100),lowMin=st.lowMin;
  var buyAmt=t.entry*t.qty,sellAmt=t.exit*t.qty;
  var feeB=Math.max(lowMin?20:0,Math.round(buyAmt*feeRate)),feeS=Math.max(lowMin?20:0,Math.round(sellAmt*feeRate));
  var taxRate=t.mode==='normal'?0.003:st.taxDay;
  var sellForTax=t.dir==='long'?sellAmt:buyAmt;
  var tax=Math.round(sellForTax*taxRate);
  var gross=t.dir==='long'?(t.exit-t.entry)*t.qty:(t.entry-t.exit)*t.qty;
  return {gross:gross,feeB:feeB,feeS:feeS,tax:tax,net:gross-feeB-feeS-tax};
}

function renderJStats(){
  var ts=DB.trades.map(function(t){var n=tradeNet(t);return Object.assign({},t,{net:n.net});});

  else{
    var sum=0,wins=[],losses=[],wl=0,sl=0,curL=0,maxL=0;
    ts.forEach(function(t){sum+=t.net;if(t.net>0){wins.push(t.net);wl+=t.net;curL=0;}else if(t.net<0){losses.push(-t.net);sl+=t.net;curL++;maxL=Math.max(maxL,curL);}});
    var wr=Math.round(wins.length/ts.length*100);

    h+='<div class="stat"><div class="v">'+(pf===null?'—':pf.toFixed(2))+'</div><div class="l">獲利因子</div></div>';
    h+='<div class="stat"><div class="v">'+(aw?money(aw):'—')+'</div><div class="l">平均賺</div></div>';
    h+='<div class="stat"><div class="v">'+(al?money(al):'—')+'</div><div class="l">平均賠</div></div>';
    h+='<div class="stat"><div class="v">'+(ratio===null?'—':ratio.toFixed(2))+'</div><div class="l">盈虧比</div></div>';
    h+='</div>';

    });
  }

  h+='</div></div>';
  return h;
}

  var rd=new FileReader();
  rd.onload=function(){try{
    var obj=JSON.parse(rd.result);
    if(!obj||!Array.isArray(obj.stocks)||!Array.isArray(obj.trades)){toast('備份檔格式不正確');return;}
    if(!confirm('匯入將覆蓋目前資料，確定？'))return;
    DB=obj;if(!DB.pro)DB.pro={active:false,product:null,checkedAt:0};
    if(!DB.settings)DB.settings=defaultDB().settings;
    saveDB();toast('已匯入');go('home');
  }catch(e){toast('備份檔讀取失敗');}};
  rd.readAsText(f);
}
function clearAll(){
  if(!confirm('將清除全部股票、日誌與設定，無法復原。確定？'))return;
  if(!confirm('再次確認？（建議先匯出備份）'))return;
  DB=defaultDB();saveDB();toast('已清除');go('home');
}

/* ═══ boot ═══ */
loadDB();
(async function boot(){
  await initBilling();
  await refreshPlaySub();
  render();
  if('serviceWorker' in navigator&&location.protocol==='https:'){
    try{navigator.serviceWorker.register('sw.js');}catch(e){}
  }
})();
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){refreshPlaySub().then(function(){render();});}
});
</script>
</body>
</html>
