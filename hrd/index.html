<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英雄升職記 TalentQuest — 職能升階遊戲 v1.2.5</title>
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="manifest" href="/hrd/manifest.json">
<link rel="icon" href="/hrd/favicon.ico">
<meta name="theme-color" content="#d4820a">
<style>
:root{
  --bg-app:#0b0f17;--bg-side:#0d1320;--bg-card:#131b28;--bg-card2:#0f1622;--bg-input:#0c121d;
  --text:#e7ecf3;--text2:#9aa7b8;--mute:#5f6c7d;--border:#1f2a3a;--border2:#2a3850;
  --gold:#f0a93c;--gold2:#ffcf7d;--cyan:#38bdf8;--green:#2fbf71;--red:#e2585b;--purple:#a78bfa;
  --radius:10px;--radius-sm:6px;
  --mono:'SF Mono','Cascadia Code',Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg-app);color:var(--text);display:flex;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a3850;border-radius:4px}
.sidebar{width:232px;min-width:232px;background:var(--bg-side);border-right:1px solid #1a2230;display:flex;flex-direction:column;z-index:10}
.brand{padding:16px 16px 12px;border-bottom:1px solid #1a2230;display:flex;align-items:center;gap:10px}
.brand .logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#f0a93c,#b45309);display:flex;align-items:center;justify-content:center;font-size:19px}
.brand .t1{font-size:14px;font-weight:800;color:#fff;letter-spacing:-.2px}
.brand .t2{font-size:10px;color:var(--text2)}
.snav{flex:1;overflow-y:auto;padding:8px 0}
.sec-t{padding:12px 16px 4px;font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--gold);opacity:.75}
.nitem{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;font-size:13px;color:var(--text2);border-left:2px solid transparent;user-select:none}
.nitem:hover{background:rgba(240,169,60,.06);color:var(--text)}
.nitem.active{background:rgba(240,169,60,.1);color:var(--gold2);border-left-color:var(--gold);font-weight:700}
.nitem .ni{width:18px;text-align:center}
.sfoot{padding:10px 16px;border-top:1px solid #1a2230;font-size:10px;color:var(--mute)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:52px;min-height:52px;background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;justify-content:space-between}
.header h1{font-size:16px;font-weight:800}
.heroSel{display:flex;gap:8px;align-items:center}
.heroSel select{background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit}
.content{flex:1;overflow-y:auto;padding:20px;background:radial-gradient(1200px 500px at 70% -10%,rgba(240,169,60,.05),transparent),var(--bg-app)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
.ch{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ch h2{font-size:14px;font-weight:800}
.cb{padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn-gold{background:linear-gradient(135deg,#f0a93c,#d4820a);color:#141a24}
.btn-cyan{background:var(--cyan);color:#06121f}
.btn-out{background:transparent;color:var(--text);border:1px solid var(--border2)}
.btn-out:hover{border-color:var(--gold);color:var(--gold2)}
.btn-red{background:transparent;color:var(--red);border:1px solid rgba(226,88,91,.4)}
.btn-sm{padding:4px 10px;font-size:12px}.btn-xs{padding:2px 8px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{background:var(--bg-input);padding:9px 10px;text-align:left;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap}
.dt td{padding:8px 10px;border-bottom:1px solid var(--border)}
.dt tbody tr:hover{background:rgba(240,169,60,.04)}
.dt .num{text-align:right;font-family:var(--mono);font-size:12px}
.dt .center{text-align:center}
.mrow{display:flex;gap:10px}.mrow>*{flex:1}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:11px;font-weight:800;color:var(--text2);margin-bottom:4px;letter-spacing:.4px;text-transform:uppercase}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--bg-input);color:var(--text)}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--gold)}
.modal-ov{position:fixed;inset:0;background:rgba(4,7,12,.72);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg-card);border:1px solid var(--border2);border-radius:12px;width:680px;max-width:92vw;max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mh{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.mh h3{font-size:15px;font-weight:800}
.mb{padding:18px}
.mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.cbtn{background:none;border:none;font-size:19px;cursor:pointer;color:var(--mute)}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700}
.b-gold{background:rgba(240,169,60,.15);color:var(--gold2)}.b-green{background:rgba(47,191,113,.15);color:var(--green)}
.b-cyan{background:rgba(56,189,248,.15);color:var(--cyan)}.b-red{background:rgba(226,88,91,.15);color:var(--red)}
.b-purple{background:rgba(167,139,250,.15);color:var(--purple)}.b-grey{background:rgba(95,108,125,.18);color:var(--text2)}
.xpbar{height:14px;background:var(--bg-input);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.xpbar>div{height:100%;background:linear-gradient(90deg,#d4820a,#f5c56b);border-radius:8px;transition:width .6s}
.lvl-badge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:74px;height:74px;border-radius:50%;background:linear-gradient(160deg,#f7d489,#c87c10);color:#241503;font-weight:800;text-align:center;box-shadow:0 4px 18px rgba(240,169,60,.35);border:3px solid #ffe3ad}
.lvl-badge .lv-t{font-size:9px;opacity:.75}.lvl-badge .lv-n{font-size:14px;line-height:1.15}
.hero-grid{display:grid;grid-template-columns:280px 1fr;gap:16px}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}}
.avater{font-size:52px;text-align:center;margin:6px 0}
.quest{display:flex;gap:10px;align-items:flex-start;background:var(--bg-card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.quest .qi{font-size:20px}
.quest.done{opacity:.55;border-color:rgba(47,191,113,.4)}
.quest .qt{font-size:13px;font-weight:700}.quest .qd{font-size:11.5px;color:var(--text2);margin-top:2px}
.qbar{height:8px;background:var(--bg-input);border-radius:5px;overflow:hidden;margin-top:6px}
.qbar>div{height:100%;background:var(--cyan)}
.chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:700;margin:2px 3px 2px 0;border:1px solid var(--border2);color:var(--text2)}
.chip.on{background:rgba(240,169,60,.14);color:var(--gold2);border-color:rgba(240,169,60,.4)}
.bcard{display:inline-flex;flex-direction:column;align-items:center;width:86px;padding:10px 6px;background:var(--bg-card2);border:1px solid var(--border);border-radius:10px;margin:0 8px 8px 0}
.bcard .bi{font-size:26px}.bcard .bn{font-size:10.5px;color:var(--text2);text-align:center;margin-top:4px}
.lvl-up{font-size:12px;color:var(--gold2);font-weight:700}
.rank-1{color:#ffd75e;font-weight:800}.rank-2{color:#cfd8e3;font-weight:800}.rank-3{color:#e0a96d;font-weight:800}
.kpi{background:var(--bg-card2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.kpi .kl{font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--mute);text-transform:uppercase}
.kpi .kv{font-size:22px;font-weight:800;font-family:var(--mono);margin-top:4px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.course{background:var(--bg-card2);border:1px solid var(--border);border-radius:10px;padding:14px}
.course .cn{font-size:14px;font-weight:800;margin-bottom:4px}
.course .cd{font-size:11.5px;color:var(--text2);margin-bottom:8px;min-height:32px}
.course.done{border-color:rgba(47,191,113,.5)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:all .25s;background:#1a2230;border:1px solid var(--border2);color:var(--text);padding:11px 22px;border-radius:10px;z-index:300;font-size:13px;pointer-events:none;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.qlabel{font-size:13px;font-weight:700;margin:14px 0 10px;line-height:1.6}
.opt{display:block;background:var(--bg-card2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:9px;cursor:pointer;font-size:13.5px;transition:all .15s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:rgba(240,169,60,.1);font-weight:700}
.opt.right{border-color:var(--green);background:rgba(47,191,113,.1)}
.opt.wrong{border-color:var(--red);background:rgba(226,88,91,.08)}
.explain{background:var(--bg-card2);border-left:3px solid var(--cyan);padding:10px 14px;font-size:12.5px;color:var(--text2);border-radius:4px;margin-top:8px;line-height:1.7}
.mini{font-size:11px;color:var(--mute)}
.hidden{display:none!important}
.langb.on{background:var(--gold);color:#141a24;border-color:var(--gold)}

/* ── 行動裝置響應式：直向 9:16 ／ 橫向 16:9 ── */
.burger{display:none;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--border2);border-radius:8px;background:var(--bg-card);color:var(--text);cursor:pointer;font-size:17px;flex-shrink:0}
.scrim{position:fixed;inset:0;background:rgba(4,7,12,.62);z-index:55;display:none}
.scrim.on{display:block}
.probar{padding:9px 16px;border-top:1px solid #1a2230;font-size:11px;font-weight:700;color:var(--gold);cursor:pointer;letter-spacing:.3px}
.probar.on{color:var(--green)}
.probar:hover{background:rgba(240,169,60,.06)}
.planbox{flex:1;border:1px solid var(--border2);border-radius:10px;padding:14px 12px;text-align:center}
.planbox .pn{font-size:13px;font-weight:800;color:var(--gold)}
.planbox .pp{font-size:22px;font-weight:800;margin:6px 0;color:var(--text)}
.planbox .pp span{font-size:12px;color:var(--mute);font-weight:400}
.planbox.feat{border-color:var(--gold);background:rgba(240,169,60,.06)}
@media(max-width:700px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .22s ease;z-index:60}
  .sidebar.open{transform:translateX(0)}
  .burger{display:flex}
  .header{height:auto;min-height:52px;flex-wrap:wrap;padding:8px 12px;gap:8px}
  .content{padding:14px 12px;overflow:auto}
  .hero-grid{grid-template-columns:1fr}
  .dt{display:block;overflow-x:auto}
  .modal{max-width:94vw;max-height:90vh}
}
@media(orientation:landscape) and (max-height:520px){
  .sidebar{width:192px;min-width:192px}
  .header{height:44px;min-height:44px;padding:0 12px}
  .content{padding:10px 14px}
  .modal{max-height:92vh}
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand"><div class="logo">🚀</div><div><div class="t1">TalentQuest</div><div class="t2">英雄升職記 · 職能升階</div></div></div>
  <nav class="snav" id="snav">

    <div class="nitem" data-page="ladder"><span class="ni">🗺️</span>職級體系</div>
    <div class="nitem" data-page="comps"><span class="ni">💠</span>職能地圖</div>
    <div class="nitem" data-page="qbank"><span class="ni">📝</span>題庫編輯</div>
      <div class="nitem" data-page="employees"><span class="ni">👤</span>員工管理</div>
    <div class="sec-t">榮耀</div>
    <div class="nitem" data-page="board"><span class="ni">🏆</span>英雄榜</div>
    <div class="nitem" data-page="guide"><span class="ni">📖</span>遊戲說明</div>
  </nav>
  <div class="sfoot">英雄升職記 TalentQuest v1.2.5 · 台灣中小企業適用</div>

</aside>
<main class="main">
  <header class="header"><button class="burger" id="burgerBtn" onclick="toggleSide()" aria-label="menu">☰</button>
    <h1 id="pageTitle">英雄旅程</h1>
    <div style="display:flex;gap:4px;margin-right:12px;" id="langBar"><button class="btn btn-out btn-xs langb on" data-lang="zh">中</button><button class="btn btn-out btn-xs langb" data-lang="en">EN</button><button class="btn btn-out btn-xs langb" data-lang="ja">日</button></div><div class="heroSel"><span id="heroSelectLabel" style="font-size:12px;color:var(--mute);">目前玩家</span><select id="heroSelect" onchange="setHero(this.value)"></select></div>
  </header>
  <div class="content" id="mainContent"></div>
</main>
<div class="scrim" id="scrim" onclick="toggleSide()"></div>
<div class="modal-ov hidden" id="modalOv"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toastBox"></div>
<script>
/* ═══════════ TALENTQUEST — 資料層 ═══════════ */
const STATE={page:'hero',heroId:null,quiz:null};
let DB=null,employees=[],courses=[],quizzes=[],completions=[],quizResults=[],promotions=[],ladder=[],comps=[],tracks=[];

function openDB(){return new Promise((res,rej)=>{const req=indexedDB.open('TQ_DB',1);req.onupgradeneeded=e=>{const db=e.target.result;['employees','courses','quizzes','completions','quizResults','promotions','ladder','comps','tracks','settings'].forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'});});};req.onsuccess=e=>{DB=e.target.result;res(DB);};req.onerror=()=>rej(req.error);});}
function dbLoad(st){return new Promise(r=>{const tx=DB.transaction(st,'readonly'),rq=tx.objectStore(st).getAll();rq.onsuccess=()=>r(rq.result||[]);rq.onerror=()=>r([]);});}
function dbSave(st,arr){return new Promise(r=>{const tx=DB.transaction(st,'readwrite'),os=tx.objectStore(st);os.clear();arr.forEach(d=>os.put(d));tx.oncomplete=()=>r();});}
async function loadD(st,def){const d=await dbLoad(st);return(d&&d.length>0)?d:def;}
async function saveD(st,arr){await dbSave(st,arr);}

/* ── 預設：職系 ── */
const DEFAULT_TRACKS=[
 {id:'t_mgr',name:'管理職系',icon:'👔'},
 {id:'t_tech',name:'技術職系',icon:'🔧'},
 {id:'t_sales',name:'業務職系',icon:'📈'},
 {id:'t_staff',name:'幕僚職系',icon:'🗂️'}
];

/* ── 預設：職級階梯（XP 門檻＋升階需求）── */
const DEFAULT_LADDER=[
 {id:'L1',order:1,name:'見習生',xpNeed:0,reqCourses:[],reqQuiz:'',desc:'入職起步，認識企業與基礎職能',salaryBand:'本薪 30,000-35,000'},
 {id:'L2',order:2,name:'初階夥伴',xpNeed:300,reqCourses:['c_newbie','c_comm'],reqQuiz:'q_comm',desc:'獨立完成基礎任務，建立職場基本功',salaryBand:'本薪 35,000-42,000'},
 {id:'L3',order:3,name:'中堅幹部',xpNeed:800,reqCourses:['c_time','c_problem','c_excel'],reqQuiz:'q_problem',desc:'能獨當一面，處理複雜日常任務',salaryBand:'本薪 42,000-52,000'},
 {id:'L4',order:4,name:'資深骨幹',xpNeed:1600,reqCourses:['c_pm','c_data','c_cross'],reqQuiz:'q_pm',desc:'領域專家，能帶新人、解難題',salaryBand:'本薪 52,000-65,000'},
 {id:'L5',order:5,name:'儲備主管',xpNeed:2800,reqCourses:['c_leader','c_okr'],reqQuiz:'q_leader',desc:'開始帶人，具備管理預備能量',salaryBand:'本薪 60,000-75,000'},
 {id:'L6',order:6,name:'基層主管',xpNeed:4200,reqCourses:['c_perf','c_coach','c_law'],reqQuiz:'q_perf',desc:'帶領團隊達成目標，執行績效管理',salaryBand:'本薪 70,000-90,000'},
 {id:'L7',order:7,name:'部門經理',xpNeed:6000,reqCourses:['c_biz','c_decision'],reqQuiz:'q_boss',desc:'經營視角，統籌部門資源與策略',salaryBand:'本薪 90,000-130,000'}
];

/* ── 預設：職能字典（16 項，三大類）── */
const DEFAULT_COMPS=[
 {id:'cp_comm',name:'溝通表達',cat:'core',desc:'清楚傳遞訊息、傾聽理解、對上對下對外皆能有效溝通'},
 {id:'cp_team',name:'團隊合作',cat:'core',desc:'與他人協作達成共同目標，願意補位與分享'},
 {id:'cp_learn',name:'學習成長',cat:'core',desc:'主動學習新知，把回饋轉化為改進'},
 {id:'cp_cust',name:'客戶導向',cat:'core',desc:'以客戶視角思考，交付符合期待的成果'},
 {id:'cp_solve',name:'問題解決',cat:'core',desc:'拆解問題、找根因、提出可行方案'},
 {id:'cp_exec',name:'執行力',cat:'core',desc:'說到做到：按時、按質、按量完成承諾'},
 {id:'cp_prof',name:'專業知識',cat:'pro',desc:'職務所需的專業技能與產業知識'},
 {id:'cp_digi',name:'數位素養',cat:'pro',desc:'善用數位工具與資料提升工作效率'},
 {id:'cp_pm',name:'專案管理',cat:'pro',desc:'規劃時程、調度資源、控管風險與交付'},
 {id:'cp_data',name:'資料分析',cat:'pro',desc:'用數據描述現況、發現問題、支持決策'},
 {id:'cp_inno',name:'創新改善',cat:'pro',desc:'持續優化流程與服務，勇於嘗試新做法'},
 {id:'cp_goal',name:'目標管理',cat:'mgmt',desc:'設定明確目標並拆解為可執行行動'},
 {id:'cp_lead',name:'領導統御',cat:'mgmt',desc:'凝聚團隊、給方向、帶出成果'},
 {id:'cp_perf',name:'績效管理',cat:'mgmt',desc:'公平評估表現並給予具體回饋'},
 {id:'cp_talent',name:'人才培育',cat:'mgmt',desc:'發現成員潛力，安排挑戰與教練引導'},
 {id:'cp_biz',name:'經營思維',cat:'mgmt',desc:'理解成本、收入與市場，做出取捨判斷'}
];

/* ── 預設：訓練課程（24 門）── */

/* ── 工具與計算 ── */
function $(s){return document.querySelector(s);}
function $$s(s){return document.querySelectorAll(s);}
function genId(){return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg){msg=T(msg);const t=document.getElementById('toastBox');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400);}
function hero(){return employees.find(x=>x.id===STATE.heroId)||employees[0]||null;}
function lvlOf(emp){let idx=0;for(let i=0;i<ladder.length;i++){if((emp.xp||0)>=ladder[i].xpNeed)idx=i;}return idx;}
function lvlName(emp){return ladder[lvlOf(emp)]?ladder[lvlOf(emp)].name:'—';}
function nextLvl(idx){return ladder[idx+1]||null;}
function empXp(emp){return emp.xp||0;}
function recalcXp(empId){
  const emp=employees.find(x=>x.id===empId);if(!emp)return;
  let xp=0;
  completions.filter(c=>c.empId===empId).forEach(c=>{const co=courses.find(x=>x.id===c.courseId);if(co)xp+=co.xp;});
  quizResults.filter(r=>r.empId===empId&&r.pass).forEach(r=>{const qz=quizzes.find(x=>x.id===r.quizId);if(qz)xp+=Math.round(r.score/100*qz.xp);});
  promotions.filter(p=>p.empId===empId&&p.status==='通過').forEach(()=>{xp+=300;});
  emp.xp=xp;
}
function bestScore(empId,quizId){const rs=quizResults.filter(r=>r.empId===empId&&r.quizId===quizId);if(!rs.length)return null;return Math.max.apply(null,rs.map(r=>r.score));}
function reqStatus(emp){
  const idx=lvlOf(emp);const nxt=nextLvl(idx);if(!nxt)return null;
  const xpOk=(emp.xp||0)>=nxt.xpNeed;
  const done=new Set(completions.filter(c=>c.empId===emp.id).map(c=>c.courseId));
  const coursesOk=(nxt.reqCourses||[]).every(id=>done.has(id));
  const needQ=nxt.reqQuiz;let quizOk=true,quizScore=null;
  if(needQ){quizScore=bestScore(emp.id,needQ);quizOk=quizScore!=null&&quizScore>=80;}
  return {nxt,idx,xpOk,coursesOk,quizOk,quizScore,courses:(nxt.reqCourses||[]).map(id=>({id,done:done.has(id)})),allOk:xpOk&&coursesOk&&quizOk};
}
function badgesOf(empId){
  const list=[];const done=completions.filter(c=>c.empId===empId);
  const res=quizResults.filter(r=>r.empId===empId&&r.pass);
  const pros=promotions.filter(p=>p.empId===empId&&p.status==='通過');
  const emp=employees.find(x=>x.id===empId);
  if(done.length>=1)list.push({i:'🎒',n:'初來乍到',d:'完成第一堂課'});
  if(done.length>=5)list.push({i:'📚',n:'學霸養成',d:'完成 5 堂課程'});
  if(done.length>=12)list.push({i:'🎓',n:'學富五車',d:'完成 12 堂課程'});
  if(res.some(r=>r.score===100))list.push({i:'💯',n:'百分俱樂部',d:'測驗拿到滿分'});
  const cats=new Set(res.map(r=>{const qz=quizzes.find(x=>x.id===r.quizId);return qz?qz.cat:'';}));
  if(cats.size>=3)list.push({i:'🌀',n:'全能選手',d:'通過 3 類不同測驗'});
  if(pros.length>=1)list.push({i:'🚀',n:'一飛沖天',d:'首次晉升'});
  if(pros.length>=3)list.push({i:'👑',n:'平步青雲',d:'晉升 3 次'});
  if((emp&&emp.xp>=3000)||0)list.push({i:'🧠',n:'經驗老道',d:'累積 XP 3000+'});
  if(done.some(c=>{const co=courses.find(x=>x.id===c.courseId);return co&&co.cat==='mgmt';}))list.push({i:'🧩',n:'管理入門',d:'完成管理類課程'});
  return list;
}
function titleOf(emp){const lv=ladder[lvlOf(emp)];const tr=tracks.find(t=>t.id===emp.track);return (tr?tr.icon+' ':'')+(lv?lv.name:'')+(emp.title?(' · '+emp.title):'');}

function markCourse(id){

function startQuiz(id){
  const qz=quizzes.find(x=>x.id===id);if(!qz)return;
  STATE.quiz={live:true,id,answers:new Array(qz.questions.length).fill(null),idx:0};
  renderPage();
}
function renderQuizRun(){
  const qz=quizzes.find(x=>x.id===STATE.quiz.id);
  const i=STATE.quiz.idx;
  let h='<div class="card"><div class="ch"><h2>'+esc(qz.name)+'</h2><span class="badge b-cyan">第 '+(i+1)+' / '+qz.questions.length+' 題</span></div><div class="cb">';
  h+='<div class="qbar" style="margin-bottom:6px;"><div style="width:'+Math.round((i)/qz.questions.length*100)+'%"></div></div>';
  const qq=qz.questions[i];
  h+='<div class="qlabel">'+(i+1)+'. '+esc(qq.q)+'</div>';
  qq.o.forEach((op,oi)=>{
    let cls='opt';
    if(STATE.quiz.answers[i]===oi)cls+=' sel';
    h+='<div class="'+cls+'" onclick="quizPick('+i+','+oi+')">'+String.fromCharCode(65+oi)+'. '+esc(op)+'</div>';
  });
  h+='<div style="display:flex;justify-content:space-between;margin-top:14px;">';
  h+='<button class="btn btn-out" onclick="quizMove(-1)" '+(i===0?'disabled':'')+'>◀ 上一題</button>';
  h+= (i===qz.questions.length-1)
    ? '<button class="btn btn-gold" onclick="quizSubmit()">交卷</button>'
    : '<button class="btn btn-gold" onclick="quizMove(1)">下一題 ▶</button>';
  h+='</div></div></div>';
  document.getElementById('mainContent').innerHTML=h;
}
function quizPick(i,oi){STATE.quiz.answers[i]=oi;renderQuizRun();}
function quizMove(d){STATE.quiz.idx=Math.max(0,Math.min(STATE.quiz.idx+d,quizzes.find(x=>x.id===STATE.quiz.id).questions.length-1));renderQuizRun();}
function quizSubmit(){
  const qz=quizzes.find(x=>x.id===STATE.quiz.id);
  const qs=STATE.quiz;
  if(qs.answers.some(a=>a===null)){toast('還有未作答的題目');return;}
  let right=0;const marks=[];
  qz.questions.forEach((qq,i)=>{const good=qs.answers[i]===qq.a;if(good)right++;marks.push({good,sel:qs.answers[i]});});
  const score=Math.round(right/qz.questions.length*100);
  const pass=score>=qz.pass;
  const emp=hero();
  quizResults.push({id:genId(),empId:emp.id,quizId:qz.id,score,pass,date:new Date().toISOString().split('T')[0]});
  saveD('quizResults',quizResults);
  recalcXp(emp.id);saveD('employees',employees);
  STATE.quiz.live=false;STATE.quiz.marks=marks;STATE.quiz.score=score;
  checkLevelUp(emp.id);
  renderPage();
  window.scrollTo(0,0);
}

function csvExport(rows,fn){
  if(!rows||!rows.length){toast('無資料可匯出');return;}
  const keys=Object.keys(rows[0]);
  const csv='\uFEFF'+keys.join(',')+'\n'+rows.map(r=>keys.map(k=>{let v=String(r[k]==null?'':r[k]);if(/[",\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"';return v;}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn+'.csv';a.click();
  toast('已匯出 '+fn+'.csv');
}

function renderQbankEdit(){
  if(!STATE.qb){STATE.page='qbank';return renderQbank();}
  const qb=STATE.qb;
  let h='<div class="card"><div class="ch"><h2>編輯測驗卷</h2><button class="btn btn-out btn-sm" onclick="qbCancel()">返回列表</button></div><div class="cb">';

    for(let j=0;j<4;j++){h+='<div class="fg" style="display:flex;gap:8px;align-items:center;"><span style="font-weight:800;min-width:18px;">'+String.fromCharCode(65+j)+'</span><input id="qbO'+i+'_'+j+'" value="'+esc(qq.o[j]||'')+'" style="flex:1;"><label style="display:flex;gap:4px;align-items:center;font-weight:400;text-transform:none;letter-spacing:0;white-space:nowrap;margin:0;"><input type="radio" name="qbA'+i+'" '+(qq.a===j?'checked':'')+'> 正確</label></div>';}

  h+='<button class="btn btn-gold" onclick="qbSave()">💾 儲存測驗卷</button></div>';
  h+='</div></div>';
  return h;
}
function qbSync(){
  const qb=STATE.qb;if(!qb)return;
  qb.name=document.getElementById('qbName')?document.getElementById('qbName').value:qb.name;
  qb.pass=Number(document.getElementById('qbPass')?document.getElementById('qbPass').value:qb.pass)||80;
  qb.xp=Number(document.getElementById('qbXp')?document.getElementById('qbXp').value:qb.xp)||150;
  qb.cat=document.getElementById('qbCat')?document.getElementById('qbCat').value:qb.cat;
  qb.questions.forEach((qq,i)=>{
    const q=document.getElementById('qbQ'+i);if(q)qq.q=q.value;
    for(let j=0;j<4;j++){const o=document.getElementById('qbO'+i+'_'+j);if(o)qq.o[j]=o.value;}
    const r=document.querySelector('input[name="qbA'+i+'"]:checked');if(r)qq.a=Number(r.value);
    const e=document.getElementById('qbE'+i);if(e)qq.e=e.value;
  });
}
function qbAddQ(){STATE.qb.questions.push({q:'',o:['','','',''],a:0,e:''});renderQbankEdit();}
function qbDelQ(i){if(STATE.qb.questions.length<=1){toast('至少保留一題');return;}STATE.qb.questions.splice(i,1);renderQbankEdit();}
function qbCancel(){STATE.qb=null;STATE.page='qbank';renderPage();}
function qbSave(){
  qbSync();const qb=STATE.qb;
  if(!qb.name.trim()){toast('請輸入測驗名稱');return;}
  if(qb.questions.some(qq=>!qq.q.trim()||qq.o.some(o=>!String(o).trim()))){toast('有題目或選項未填完整');return;}
  const idx=quizzes.findIndex(x=>x.id===qb.id);
  if(idx>=0)quizzes[idx]=qb;else{qb.id=genId();quizzes.push(qb);}
  saveActive('quizzes',quizzes);
  STATE.qb=null;STATE.page='qbank';renderPage();
  toast('測驗卷已儲存，立即生效於測驗中心');
}
function delQuiz(id){
  const qz=quizzes.find(x=>x.id===id);
  const used=ladder.find(l=>l.reqQuiz===id);
  if(used){toast('此測驗卷被「'+used.name+'」職級設為門檻，請先於職級體系調整');return;}
  if(!confirm('確定刪除「'+(qz?qz.name:'')+'」？歷史成績將保留。'))return;
  quizzes=quizzes.filter(x=>x.id!==id);
  saveActive('quizzes',quizzes);renderPage();
}
function qbExportOne(){
  qbSync();
  const blob=new Blob([JSON.stringify(STATE.qb,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(STATE.qb.name||'測驗卷')+'.json';a.click();
  toast('已匯出測驗卷 JSON');
}
function qbExportAll(){if(!requirePro('報表與資料匯出'))return;
  const blob=new Blob([JSON.stringify(quizzes,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TalentQuest_題庫.json';a.click();
  toast('已匯出全部題庫');
}
function qbImport(){if(!requirePro('報表與資料匯出'))return;
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);const arr=Array.isArray(d)?d:[d];
      let added=0;
      arr.forEach(qz=>{if(qz.name&&Array.isArray(qz.questions)&&qz.questions.length>0){
        qz.id=genId();qz.pass=qz.pass||80;qz.xp=qz.xp||150;qz.cat=qz.cat||'core';
        qz.questions=qz.questions.map(qq=>({q:qq.q||'',o:[qq.o?qq.o[0]||'':'',qq.o?qq.o[1]||'':'',qq.o?qq.o[2]||'':'',qq.o?qq.o[3]||'':''],a:Number(qq.a)||0,e:qq.e||''}));
        quizzes.push(qz);added++;}});
      saveActive('quizzes',quizzes);renderPage();toast('已匯入 '+added+' 卷測驗');
    }catch(err){toast('匯入失敗：'+err.message);}};
    r.readAsText(f);};
  i.click();
}

function T(zh){
  if(LANG==='zh') return zh;
  const e = STRINGS[zh];
  return (e && e[LANG]) || zh;
}
let LANG_SNAP = {main:'', modal:''};
function captureMain(){ const mc=document.getElementById('mainContent'); if(mc) LANG_SNAP.main = mc.innerHTML; }
function captureModal(){ const mb=document.getElementById('modalBox'); if(mb) LANG_SNAP.modal = mb.innerHTML; }
function trHTML(html){
  if(LANG==='zh') return html;
  let out = html;
  const keys = Object.keys(STRINGS).sort((a,b)=>b.length-a.length);
  for(const k of keys){
    const e = STRINGS[k];
    const t = e[LANG];
    if(t && out.indexOf(k)>=0) out = out.split(k).join(t);
  }
  return out;
}
function applyMain(){ const mc=document.getElementById('mainContent'); if(mc&&LANG_SNAP.main){ mc.innerHTML = trHTML(LANG_SNAP.main); } }
function applyShell(){
  // 以 dataset.zh 為原文錨點（無狀態、可雙向切換）
  $$s('.nitem').forEach(el=>{
    const key = el.dataset.page;
    if(!key || !PAGE_TITLES[key]) return;
    const zh = PAGE_TITLES[key];
    if(!el.dataset.zh) el.dataset.zh = zh;
    const t = T(el.dataset.zh);
    const tn = el.lastChild;
    if(tn && tn.nodeType===3){ tn.nodeValue = t; }
  });
  $$s('.sec-t').forEach(el=>{
    if(!el.dataset.zh) el.dataset.zh = el.textContent.trim();
    el.textContent = T(el.dataset.zh);
  });
  const ht = document.getElementById('pageTitle');
  if(ht){ if(!ht.dataset.zh) ht.dataset.zh = ht.textContent.trim(); ht.textContent = T(ht.dataset.zh); }
  const pb = document.getElementById('proBar');
  if(pb)updateProBadge();
  const hsel = document.getElementById('heroSelect');
  if(hsel){ [...hsel.options].forEach(o=>{ o.textContent = trHTML(o.textContent); }); }
  const hs = document.getElementById('heroSelectLabel');
  if(hs){ if(!hs.dataset.zh) hs.dataset.zh = hs.textContent.trim(); hs.textContent = T(hs.dataset.zh); }
  const bt2 = document.querySelector('.brand .t2');
  if(bt2){ if(!bt2.dataset.zh) bt2.dataset.zh = bt2.textContent.trim(); bt2.textContent = T(bt2.dataset.zh); }
  const sf = document.querySelector('.sfoot');
  if(sf){ if(!sf.dataset.zh) sf.dataset.zh = 'TalentQuest v1.2.3 · 台灣中小企業適用'; sf.textContent = LANG==='en'?'TalentQuest v1.1 · for SMEs':(LANG==='ja'?'TalentQuest v1.1 ・ 中小企業向け':sf.dataset.zh); }
}
function setModalHTML(h){ const mb=document.getElementById('modalBox'); mb.innerHTML = trHTML(h); LANG_SNAP.modal = mb.innerHTML; }

/* ═══════════ TALENTQUEST — 語言控制器 ═══════════ */
const L10N_DATA = {en: L10N_EN, ja: L10N_JA};

function activeDatasets(){
  if(LANG==='zh') return null;
  const key = 'tq_data_' + LANG;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(key) || 'null'); } catch(e){ saved = null; }
  if(saved && saved.tracks && saved.quizzes) return saved;
  const D = L10N_DATA[LANG];
  return JSON.parse(JSON.stringify({tracks:D.tracks, ladder:D.ladder, comps:D.comps, courses:D.courses, quizzes:D.quizzes}));
}
function persistLangData(){
  if(LANG==='zh') return;
  localStorage.setItem('tq_data_' + LANG, JSON.stringify({tracks, ladder, comps, courses, quizzes}));
}
let ZH_MASTER = null;
function localizedList(masterArr, defArr){
  const byId = new Map(defArr.map(x=>[x.id,x]));
  const out = []; const customs = [];
  masterArr.forEach(m=>{
    const l = byId.get(m.id);
    if(l){ out.push(Object.assign(JSON.parse(JSON.stringify(m)), l)); }
    else { customs.push(JSON.parse(JSON.stringify(m))); }
  });
  customs.forEach(c=>out.push(c));
  return out;
}
function applyLangData(){
  if(LANG==='zh'){
    if(ZH_MASTER){ tracks=ZH_MASTER.tracks; ladder=ZH_MASTER.ladder; comps=ZH_MASTER.comps; courses=ZH_MASTER.courses; quizzes=ZH_MASTER.quizzes; }
    return;
  }
  if(!ZH_MASTER) ZH_MASTER = {tracks, ladder, comps, courses, quizzes};
  const a = activeDatasets();
  if(!a) return;
  tracks = localizedList(ZH_MASTER.tracks, a.tracks);
  ladder = localizedList(ZH_MASTER.ladder, a.ladder);
  comps = localizedList(ZH_MASTER.comps, a.comps);
  courses = localizedList(ZH_MASTER.courses, a.courses);
  quizzes = localizedList(ZH_MASTER.quizzes, a.quizzes);
}
function setLang(v){
  LANG = v; localStorage.setItem('tq_lang', v);
  applyLangData();
  renderPage();
  syncLangBar();
  toast(v==='zh'?'已切換為繁體中文':(v==='en'?'Switched to English':'日本語に切り替えました'));
}
function syncLangBar(){
  $$s('.langb').forEach(b=>b.classList.toggle('on', b.dataset.lang===LANG));
}
function saveActive(store, arr){
  if(LANG==='zh'){ saveD(store, arr); }
  else { persistLangData(); }
}
document.getElementById('langBar').addEventListener('click', e=>{
  const b = e.target.closest('.langb');
  if(b) setLang(b.dataset.lang);
});

var IAP_ID='tq_pro_lifetime';
var FREE_EMP_LIMIT=6;
var FREE_DAYS=180;
var billingService=null,TQ_PRO=false;
try{TQ_PRO=localStorage.getItem('tq_pro')==='1';}catch(e){}
var TQ_FIRST=0;
try{var _tqf=localStorage.getItem('tq_first');if(_tqf)TQ_FIRST=parseInt(_tqf,10)||0;}catch(e){}
if(!TQ_FIRST){TQ_FIRST=Date.now();try{localStorage.setItem('tq_first',String(TQ_FIRST));}catch(e){}}
function isPro(){return TQ_PRO;}
function savePro(v){TQ_PRO=!!v;try{localStorage.setItem('tq_pro',TQ_PRO?'1':'0');}catch(e){}updateProBadge();}
function freeDaysLeft(){var d=Math.ceil((TQ_FIRST+FREE_DAYS*86400000-Date.now())/86400000);return d>0?d:0;}
function inFreeWindow(){return freeDaysLeft()>0;}
async function initBilling(){
  if(!('getDigitalGoodsService' in window)){billingService=null;return;}
  try{billingService=await window.getDigitalGoodsService('play');}catch(e){billingService=null;}
}
async function refreshPlaySub(){
  if(!billingService)return;
  try{
    var ps=await billingService.listPurchases();
    var act=ps.filter(function(p){return p.productId===IAP_ID&&p.purchaseState==='PURCHASED';});
    for(var i=0;i<act.length;i++){try{await billingService.acknowledge(act[i].purchaseToken,act[i].productId);}catch(e){}}
    savePro(act.length>0);
  }catch(e){}
}
async function buyLifetime(){
  if(!billingService){toast('目前環境未偵測到 Google Play 服務（網頁版）——請於 Google Play 下載 App 後購買。');return;}
  try{
    var details=await billingService.getDetails([IAP_ID]);
    if(!details||!details.length){toast('查無商品，請確認 Play 商品已建立');return;}
    await billingService.launchPaymentFlow(details[0]);
    await refreshPlaySub();
    document.getElementById('modalOv').classList.add('hidden');
    toast(TQ_PRO?'購買成功，永久版已解鎖':'購買流程未完成');
  }catch(e){toast('購買流程未完成或發生錯誤');}
}
async function restorePurchases(){
  if(!billingService){toast('此環境不支援 Google Play 購買');return;}
  await refreshPlaySub();
  toast(TQ_PRO?'已恢復購買，永久版啟用中':'查無有效購買紀錄');
}
function updateProBadge(){
  var b=document.getElementById('proBar');if(!b)return;
  if(TQ_PRO){b.textContent=T('已購買永久版 ✓');b.className='probar on';}
  else if(inFreeWindow()){b.textContent=T('免費試用中 · 剩餘 ')+freeDaysLeft()+T(' 天');}
  else{b.textContent=T('試用結束 · 解鎖永久版');}
}
function requirePro(feature){if(!billingService)return true;if(TQ_PRO)return true;if(inFreeWindow())return true;openSubModal(feature);return false;}
function empGateOK(){if(!billingService)return true;if(TQ_PRO)return true;if(inFreeWindow())return true;if(employees.length<FREE_EMP_LIMIT)return true;openSubModal('員工人數上限（免費試用版 6 人）');return false;}

  var h='<h2 style="margin-top:0;font-size:19px;">'+T('解鎖永久版')+'</h2>';
  if(feature)h+='<div class="mini" style="margin-bottom:8px;">'+T(feature)+'</div>';

    h+='<div style="background:rgba(47,191,113,.12);color:var(--green);padding:14px;border-radius:10px;font-weight:700;text-align:center;margin-top:6px;">'+T('已購買永久版 ✓')+'</div>';
