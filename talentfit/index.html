/* ═══ 計分引擎 ═══ */
function facetScores(b5) {
  const raw = { O:0, C:0, E:0, A:0, N:0 };
  B5_ITEMS.forEach((it, i) => { const v = b5[i] || 3; raw[it.f] += it.pos ? v : (6 - v); });
  const out = {};
  for (const f of ['O','C','E','A','N']) out[f] = Math.round((raw[f] - 6) / 24 * 100);
  return out;
}
function facetLevel(v){ return v >= 70 ? 'high' : (v >= 40 ? 'mid' : 'low'); }
function facetLvName(v){ return v >= 70 ? L('高','High') : (v >= 40 ? L('中','Mid') : L('低','Low')); }
function facetColor(v){ return v >= 70 ? '#166534' : (v >= 40 ? '#b45309' : '#b91c1c'); }
function valueScores(vals) { const out = {}; for (const k of Object.keys(VALUE_NAMES)) out[k] = 0; VALUE_ITEMS.forEach((it, i) => { out[it.v] += vals[i] || 3; }); return out; }
function topValues(vals) { return Object.entries(valueScores(vals)).sort((a,b) => b[1]-a[1]).slice(0,3).map(([k]) => k); }
function sjtScore(ans) { let s = 0; SJT_ITEMS.forEach((it,i) => { s += it.scores[ans[i] ?? 0] ?? 0; }); return { raw:s, pct: Math.round(s/16*100) }; }
function attScore(ans) { let s = 0; ATT_ITEMS.forEach((it,i) => { const v = ans[i] || 2; s += it.pos ? v : (5 - v); }); return { raw:s, pct: Math.round((s-8)/24*100) }; }
function consistencyFlags(b5) { const f = []; for (const [a,b] of CONSISTENCY_PAIRS) if (Math.abs((b5[a]||3)+(b5[b]||3)-6) > 1) f.push([a,b]); return f; }
function matchPosition(facets, sjtPct, attPct, tpl) {
  let s = 0, w = 0; const parts = {};
  for (const f of ['O','C','E','A','N']) {
    const p = tpl.fit[f], dev = Math.abs(facets[f] - p.i);
    const sc = Math.max(0, Math.round(100 - dev / p.t * 50));
    parts[f] = sc; s += sc * p.w; w += p.w;
  }
  let base = Math.round(s / w);
  const pens = [];
  if (sjtPct < 40) { base -= 10; pens.push('情境判斷偏低（−10）'); }
  if (attPct < 40) { base -= 10; pens.push('工作態度偏低（−10）'); }
  return { score: Math.max(0, Math.min(100, base)), parts, pens };
}
function matchAll(c) {
  return POSITIONS.map(tpl => ({ key:tpl.key, name:PNAME(tpl), desc:PDESC(tpl), ...matchPosition(c.facets, c.sjtPct, c.attPct, tpl) }))
    .sort((a,b) => b.score - a.score);
}
function bandIdx(sc){ return sc >= 75 ? 0 : sc >= 60 ? 1 : sc >= 45 ? 2 : 3; }
function bandOf(sc){ return BANDS()[bandIdx(sc)]; }
function bandBadge(sc){ return isEN()
  ? [{t:'Strong fit', cls:'b-s'},{t:'Possible', cls:'b-i'},{t:'Caution', cls:'b-w'},{t:'Not advised', cls:'b-d'}][bandIdx(sc)]
  : [{t:'高適配', cls:'b-s'},{t:'可考慮', cls:'b-i'},{t:'謹慎評估', cls:'b-w'},{t:'不建議', cls:'b-d'}][bandIdx(sc)]; }

/* 個人職涯畫像 */
function buildPersonal(c) {
  const matches = matchAll(c);
  const strengths = [], watches = [], grows = [];
  for (const f of ['O','C','E','A','N']) {
    const v = c.facets[f], lv = facetLevel(v), g = FACET_GUIDE[f][lv];
    const item = { f, v, lv, t:g.t, s:g.s, w:g.w, gr:g.g };
    if (lv === 'high') strengths.push(item);
    if (lv === 'low') watches.push(item);
    grows.push(item);
  }
  const top = matches[0];
  const devList = ['O','C','E','A','N'].map(f => {
    const p = top ? POSITIONS.find(x => x.key === top.key).fit[f] : null;
    return p ? { f, dev: c.facets[f] - p.i, ideal: p.i } : null;
  }).filter(Boolean).sort((a,b) => Math.abs(b.dev) - Math.abs(a.dev)).slice(0, 2);
  const vals = topValues(c.vals);
  return { matches, strengths, watches, devList, vals, top };
}
function probeQuestions(c) {

  const bank = {
    C_l: L('請描述你同時處理多項任務時如何管理期限？舉上個月的實際例子。','Describe how you manage deadlines when handling multiple tasks at once. Give a real example from last month.'),

    E_l: L('這份職務需要主動與人接觸——你通常怎麼和初次見面的客戶或同事建立關係？','This role needs proactive contact with people — how do you usually build rapport with new clients or colleagues?'),
    E_h: L('你如何拿取與人互動和安靜完成工作的平衡？','How do you balance interacting with people and getting quiet, focused work done?'),
    A_l: L('請舉一次和同事意見不同的經驗：你當時怎麼處理？結果如何？','Describe a time you disagreed with a colleague: how did you handle it, and what was the result?'),
    N_l: L('上次工作出錯被指正時，你當下的反應是什麼？後來怎麼調適與改進？','When your mistake was pointed out last time, how did you react? How did you adjust and improve afterwards?'),
    N_h: L('工作壓力最大的時期，你靠什麼方式維持狀態？','During your most stressful work periods, what keeps you in shape?'),
    O_l: L('最近三個月你學了什麼新事物？是怎麼學的？','What new things have you learned in the past three months? How did you learn them?'),
    O_h: L('請舉一個你提出新做法並被採用（或被退回）的例子。','Give an example of a new approach you proposed that was adopted (or rejected).'),
    V: L('你期望三五年後的工作樣貌是什麼？這份工作在你的規劃中扮演什麼角色？','What do you want your work to look like in three to five years? What role does this job play in that plan?'),
    SJT: L('（情境判斷待加強）針對測驗中處理不佳的情境，請受測者現場模擬一次處理方式，觀察臨場反應。','(SJT below bar) For the situations handled poorly in the test, ask the candidate to role-play the handling on the spot and observe their response.'),
    ATT: L('（工作態度待確認）請舉例說明受測者對「沒人檢查也照規定做」的看法與實際經驗。','(Work attitude to confirm) Ask for the candidate’s view and real experience on “following rules even when nobody checks”.'),
  };
  const probes = [];
  const devs = ['O','C','E','A','N'].map(f => ({ f, dev: c.facets[f] - tpl.fit[f].i })).sort((a,b) => Math.abs(b.dev) - Math.abs(a.dev)).slice(0,3);
  devs.forEach(d => { const k = d.f + (d.dev > 0 ? '_h' : '_l'); if (bank[k]) probes.push({ color: facetColor(c.facets[d.f]), text: FNAME(d.f) + ' ' + c.facets[d.f] + L('（理想 ',' (ideal ') + tpl.fit[d.f].i + L('）：','): ') + bank[k] }); });
  if (c.sjtPct < 60) probes.push({ color:'#b91c1c', text: bank.SJT });
  if (c.attPct < 60) probes.push({ color:'#b91c1c', text: bank.ATT });
  probes.push({ color:'#1d4ed8', text: bank.V });
  return probes.slice(0, 5);
}
function redFlags(c) {
  const out = [];
  if (c.facets.N < 30) out.push({ color:'#b91c1c', text: L('情緒穩定偏低：面談請多關懷壓力因應與近期狀態；此指標不可單獨作為排除依據。','Emotional stability is low: in the interview, show care about stress coping and recent state; this indicator must not be used alone for rejection.') });
  if (c.sjtPct < 40) out.push({ color:'#b91c1c', text: L('情境判斷低於 40 分：建議增加實作或情境模擬面試再決定。','SJT below 40: add hands-on or situational simulation interviews before deciding.') });
  if (c.attPct < 40) out.push({ color:'#b91c1c', text: L('工作態度低於 40 分：誠信紀律向度請在面談與背書調查中再確認。','Work attitude below 40: reconfirm integrity and discipline in interviews and reference checks.') });
  if (c.consist.length >= 2) out.push({ color:'#92400e', text: L('作答一致性待確認：有多組反向題回答矛盾，建議擇期重測或面談釐清。','Answer consistency warning: multiple reverse-item contradictions; consider a retest or clarify in the interview.') });
  return out;
}
function radarSVG(facets, size) {
  const keys = ['O','C','E','A','N'], labels = keys.map(k => FNAME(k));
  const W = size || 250, cx = W/2, cy = W/2 + 6, R = W/2 - 40;
  const ang = i => -Math.PI/2 + i*(2*Math.PI/5);
  const ring = k => keys.map((f,i) => (cx + R*k/100*Math.cos(ang(i))).toFixed(1)+','+(cy + R*k/100*Math.sin(ang(i))).toFixed(1)).join(' ');
  let s = '<svg viewBox="0 0 '+W+' '+(W+10)+'" style="width:'+W+'px;max-width:100%;display:block;margin:0 auto;">';
  for (const k of [25,50,75,100]) s += '<polygon points="'+ring(k)+'" fill="none" stroke="#e7e5e4"/>';
  keys.forEach((f,i) => { s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx + R*Math.cos(ang(i))).toFixed(1)+'" y2="'+(cy + R*Math.sin(ang(i))).toFixed(1)+'" stroke="#e7e5e4"/>'; });
  const pts = keys.map((f,i) => { const r = R*facets[f]/100; return (cx + r*Math.cos(ang(i))).toFixed(1)+','+(cy + r*Math.sin(ang(i))).toFixed(1); }).join(' ');
  s += '<polygon points="'+pts+'" fill="rgba(180,83,9,0.18)" stroke="#b45309" stroke-width="2"/>';
  keys.forEach((f,i) => { const r = R*facets[f]/100; s += '<circle cx="'+(cx + r*Math.cos(ang(i))).toFixed(1)+'" cy="'+(cy + r*Math.sin(ang(i))).toFixed(1)+'" r="3" fill="#b45309"/>'; });
  keys.forEach((f,i) => {
    const lx = cx + (R+20)*Math.cos(ang(i)), ly = cy + (R+18)*Math.sin(ang(i));
    const anchor = Math.abs(Math.cos(ang(i))) < .3 ? 'middle' : (Math.cos(ang(i)) > 0 ? 'start' : 'end');
    s += '<text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" text-anchor="'+anchor+'" font-size="11.5" font-weight="700" fill="#1c1917">'+labels[i]+' '+facets[f]+'</text>';
  });
  return s + '</svg>';
}
function facetBars(facets) {
  return ['O','C','E','A','N'].map(f => {
    const v = facets[f];
    return '<div class="facbar"><span>'+FNAME(f)+'</span><div class="bar"><div style="width:'+v+'%;background:'+facetColor(v)+';"></div></div><span class="num" style="color:'+facetColor(v)+';font-weight:700;">'+v+' '+facetLvName(v)+'</span></div>';
  }).join('');
}

/* ═══ 儲存（IndexedDB，全本機）═══ */
const DB_NAME = 'TALENTFIT_DB', DB_VERSION = 1, STORES = ['records','draft'];
let _db = null;
function openDB(){ return new Promise((res, rej) => { if (_db) return res(_db); const rq = indexedDB.open(DB_NAME, DB_VERSION); rq.onupgradeneeded = e => { const db = e.target.result; for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath:'id' }); }; rq.onsuccess = e => { _db = e.target.result; res(_db); }; rq.onerror = e => rej(e.target.error); }); }
async function dbLoad(store){ const db = await openDB(); return new Promise(res => { const rq = db.transaction(store,'readonly').objectStore(store).getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]); }); }
async function dbSave(store, data){ const db = await openDB(); return new Promise(res => { const tx = db.transaction(store,'readwrite'); const os = tx.objectStore(store); os.clear(); (data||[]).forEach(d => os.put(d)); tx.oncomplete = () => res(); }); }
async function load(k, f){ try { const d = await dbLoad(k); if (d && d.length > 0) return d; } catch(e) {} try { const v = localStorage.getItem('tf_' + k); if (v) { const d = JSON.parse(v); if (d && d.length > 0) { await dbSave(k, d); localStorage.removeItem('tf_' + k); return d; } } } catch(e) {} return f; }
async function save(k, d){ try { await dbSave(k, d); } catch(e) {} }
function genId(){ return 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function posName(k){ if (k === 'best') return L('由系統推薦','Recommended by app'); const p = POSITIONS.find(x => x.key === k); return p ? PNAME(p) : L('由系統推薦','Recommended by app'); }
function recTopName(c){ return c.topMatch ? posName(c.topMatch.key) : ''; }

function finalizeRecord(d) {
  const facets = facetScores(d.b5);
  const s = sjtScore(d.sjt), a = attScore(d.att);
  const rec = { id: genId(), mode: d.mode || 'self', name: d.name, position: d.position, date: d.date,
    created: new Date().toISOString().slice(0,10), b5: d.b5.slice(), vals: d.vals.slice(), sjt: d.sjt.slice(), att: d.att.slice(),
    facets, sjtPct: s.pct, attPct: a.pct, consist: consistencyFlags(d.b5) };
  rec.topMatch = matchAll(rec)[0];
  return rec;
}

/* 示範資料（首次啟動） */
function genB5(t) {
  const out = Array(30).fill(3);
  ['O','C','E','A','N'].forEach((f, fi) => {
    const targetRaw = Math.round(6 + 0.24 * t[f]);
    const per = Math.floor(targetRaw/6), rem = targetRaw - per*6;
    const contribs = [per,per,per,per,per,per];
    for (let k = 0; k < rem; k++) contribs[k]++;
    for (let k = 0; k < fi; k++) contribs.push(contribs.shift());
    let n = 0;
    B5_ITEMS.forEach((it, i) => { if (it.f !== f) return; out[i] = it.pos ? contribs[n] : 6 - contribs[n]; n++; });
  });
  return out;
}
function genVals(t){ return VALUE_ITEMS.map((it,i) => Math.max(1, Math.min(5, Math.round(t[it.v]/20) + [0,-1][i%2]))); }
function makeDemo() {
  const d = { id:'demo', mode:'self', name: L('示範報告（可刪除）','Sample report (deletable)'), position:'sales', date:'2026-10-20', created:'2026-10-20',
    b5: genB5({E:80,N:65,C:72,O:78,A:62}), vals: genVals({V1:55,V2:85,V3:40,V4:75,V5:50,V6:80}), sjt:[0,0,0,0,1,0,0,0], att:[4,4,3,2,3,4,3,4] };
  return finalizeRecord(d);
}

  h += '<div class="card"><div class="card-b"><div class="notice" style="margin-top:0;border-top:none;padding-top:0;">' + L('紀錄僅儲存於本裝置；清除 App 資料或瀏覽器資料會一併移除。需要長期保存請用「匯出 CSV」或報告的「列印／PDF」。','Records are stored on this device only; clearing app or browser data removes them. For long-term storage use “Export CSV” or the report’s “Print / PDF”.') + '</div></div></div>';

}

(async function init() {
  try {
    await openDB();
    RECORDS = await load('records', []);
    if (!RECORDS.length) { RECORDS = [makeDemo()]; await save('records', RECORDS); }
    const d = await load('draft', []);
    DRAFT = (d && d.length > 0 && (d[0].b5 || []).some(v => v > 0) || (d && d[0] && d[0].consent)) ? d[0] : blankDraft();
  } catch (e) { RECORDS = [makeDemo()]; DRAFT = blankDraft(); }
  applyStaticLang();
  renderPage();
})();
