<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP 企業管理系統 V3.0 — 財務會計＋進銷存＋人力資源</title>
<style>
/* ═══════════════════════════════════════════════
   DESIGN: Industrial Utilitarian — Bloomberg-inspired
   Palette: Deep Space + Signal Amber accents
   ═══════════════════════════════════════════════ */
:root {
  --bg-app: #0a0e14;
  --bg-sidebar: #0d1117;
  --bg-main: #f5f3ef;
  --bg-card: #ffffff;
  --bg-input: #f8f7f4;
  --bg-row-alt: #faf9f7;
  --bg-modal: #ffffff;
  --text-primary: #1a1a18;
  --text-secondary: #6b6a65;
  --text-muted: #9a9995;
  --text-sidebar: #8b949e;
  --text-sidebar-active: #e6edf3;
  --accent: #d4820a;
  --accent-light: #f5a623;
  --positive: #1b7d46;
  --negative: #c0392b;
  --border: #e0ded8;
  --border-light: #eeede9;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
  --radius: 6px;
  --radius-sm: 4px;
  --font-mono: 'SF Mono','Cascadia Code','JetBrains Mono','Consolas',monospace;
  --font-sans: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;
  --sidebar-w: 240px;
  --header-h: 48px;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font-sans); background:var(--bg-app); color:var(--text-primary); display:flex; height:100vh; overflow:hidden; }

/* ── Sidebar ── */
.sidebar {
  width:var(--sidebar-w); min-width:var(--sidebar-w); background:var(--bg-sidebar);
  display:flex; flex-direction:column; border-right:1px solid #1c2128; z-index:10;
}
.sidebar-brand {
  padding:16px 18px; border-bottom:1px solid #1c2128;
  display:flex; align-items:center; gap:10px;
}
.sidebar-brand .icon { width:28px; height:28px; background:var(--accent); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; }
.sidebar-brand .title { font-size:14px; font-weight:700; color:var(--text-sidebar-active); letter-spacing:-0.3px; }
.sidebar-brand .sub { font-size:10px; color:var(--text-sidebar); margin-top:1px; }

.sidebar-nav { flex:1; overflow-y:auto; padding:8px 0; }
.nav-section { margin-bottom:6px; }
.nav-section-title {
  padding:10px 18px 4px; font-size:10px; font-weight:700;
  text-transform:uppercase; letter-spacing:1.2px; color:var(--accent); opacity:0.7;
}
.nav-item {
  display:flex; align-items:center; gap:8px; padding:8px 18px; cursor:pointer;
  font-size:13px; color:var(--text-sidebar); transition:all 0.15s; border-left:2px solid transparent;
  user-select:none;
}
.nav-item:hover { background:rgba(255,255,255,0.04); color:var(--text-sidebar-active); }
.nav-item.active { background:rgba(212,130,10,0.08); color:var(--accent-light); border-left-color:var(--accent); font-weight:600; }
.nav-item .nav-icon { font-size:14px; width:18px; text-align:center; }

.sidebar-footer { padding:12px 18px; border-top:1px solid #1c2128; font-size:11px; color:var(--text-sidebar); display:flex; justify-content:space-between; }

/* ── Main ── */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.header {
  height:var(--header-h); min-height:var(--header-h); background:var(--bg-card);
  border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 20px;
  justify-content:space-between; box-shadow:var(--shadow);
}
.header h1 { font-size:16px; font-weight:700; color:var(--text-sidebar-active); letter-spacing:-0.3px; }
.header-actions { display:flex; gap:8px; align-items:center; }
.header-date { font-size:12px; color:var(--text-muted); font-family:var(--font-mono); }

.content { flex:1; overflow-y:auto; padding:20px; background:var(--bg-main); }

/* ── Cards ── */
.card { background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border-light); }
.card-header { padding:14px 18px; border-bottom:1px solid var(--border-light); display:flex; justify-content:space-between; align-items:center; }
.card-header h2 { font-size:14px; font-weight:700; }
.card-body { padding:18px; }

/* ── Toolbar ── */
.toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.toolbar .spacer { flex:1; }

/* ── Buttons ── */
.btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; cursor:pointer; border:none; transition:all 0.15s; font-family:inherit; white-space:nowrap; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:#b87008; }
.btn-outline { background:#fff; color:var(--text-primary); border:1px solid var(--border); }
.btn-outline:hover { background:var(--bg-input); border-color:#ccc; }
.btn-danger { background:#fff; color:var(--negative); border:1px solid #f0d0d0; }
.btn-danger:hover { background:#fef2f2; }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-xs { padding:2px 8px; font-size:11px; }

/* ── Table ── */
.data-table { width:100%; border-collapse:collapse; font-size:13px; }
.data-table th {
  background:var(--bg-input); padding:10px 12px; text-align:left; font-weight:700;
  font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-secondary);
  border-bottom:2px solid var(--border); white-space:nowrap;
}
.data-table td { padding:9px 12px; border-bottom:1px solid var(--border-light); }
.data-table tbody tr:hover { background:rgba(212,130,10,0.04); }
.data-table .num { text-align:right; font-family:var(--font-mono); font-size:12px; }
.data-table .center { text-align:center; }
.data-table .debit { color:var(--text-primary); }
.data-table .credit { color:var(--negative); }

/* ── Forms ── */
.form-group { margin-bottom:12px; }
.form-group label { display:block; font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.3px; }
.form-group input, .form-group select, .form-group textarea {
  width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm);
  font-size:13px; font-family:inherit; background:var(--bg-input); transition:border-color 0.15s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(212,130,10,0.1); }
.form-row { display:flex; gap:12px; }
.form-row > * { flex:1; }

/* ── Modal ── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; display:flex; align-items:center; justify-content:center; }
.modal { background:var(--bg-modal); border-radius:var(--radius); box-shadow:var(--shadow-lg); width:640px; max-width:90vw; max-height:85vh; overflow-y:auto; }
.modal-header { padding:16px 20px; border-bottom:1px solid var(--border-light); display:flex; justify-content:space-between; align-items:center; }
.modal-header h3 { font-size:15px; font-weight:700; }
.modal-body { padding:20px; }
.modal-footer { padding:14px 20px; border-top:1px solid var(--border-light); display:flex; gap:8px; justify-content:flex-end; }
.close-btn { background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-muted); padding:4px; line-height:1; }

/* ── KPI Cards ── */
.kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
.kpi-card { background:var(--bg-card); border-radius:var(--radius); padding:16px; border:1px solid var(--border-light); box-shadow:var(--shadow); }
.kpi-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); margin-bottom:6px; }
.kpi-value { font-size:26px; font-weight:800; font-family:var(--font-mono); letter-spacing:-1px; }
.kpi-value.positive { color:var(--positive); }
.kpi-value.negative { color:var(--negative); }
.kpi-value.neutral { color:var(--text-primary); }

/* ── KPI Index Analysis (V2.2) ── */
.kpi-progress { height:8px; background:#f0eee8; border-radius:4px; overflow:hidden; margin-top:8px; }
.kpi-progress-bar { height:100%; border-radius:4px; }
.kpi-insight { display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:1.55; padding:8px 2px; border-bottom:1px dashed var(--border-light); }
.kpi-insight:last-child { border-bottom:none; }
.kpi-insight .dot { width:9px; height:9px; border-radius:50%; margin-top:5px; flex:none; }
.kpi-top-grid { display:grid; grid-template-columns:300px 1fr; gap:14px; margin-bottom:18px; }
.kpi-mid-grid { display:grid; grid-template-columns:320px 1fr; gap:14px; margin-bottom:18px; }
.kpi-pillar-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:900px) { .kpi-top-grid, .kpi-mid-grid, .kpi-pillar-grid { grid-template-columns:1fr; } }

/* ── Badge / Status ── */
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.badge-success { background:#e6f4ea; color:var(--positive); }
.badge-warning { background:#fef3e0; color:var(--accent); }
.badge-danger { background:#fce8e6; color:var(--negative); }

/* ── Search ── */
.search-input { padding:7px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13px; font-family:inherit; width:200px; background:var(--bg-input); }
.search-input:focus { outline:none; border-color:var(--accent); }

/* ── Journal Entry Lines ── */
.entry-line { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.entry-line select { flex:2; }
.entry-line input { flex:1; }

/* ── Empty State ── */
.empty-state { text-align:center; padding:40px 20px; color:var(--text-muted); }
.empty-state .empty-icon { font-size:40px; margin-bottom:12px; }
.empty-state p { font-size:13px; }

/* ── Tabs ── */
.tabs { display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:16px; }
.tab { padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer; color:var(--text-muted); border-bottom:2px solid transparent; margin-bottom:-2px; transition:all 0.15s; user-select:none; }
.tab:hover { color:var(--text-primary); }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* ── Report totals ── */
.report-section { margin-bottom:20px; }
.report-section h3 { font-size:14px; font-weight:700; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border-light); }
.total-row td { font-weight:700; border-top:2px solid var(--border); background:var(--bg-input); }
.indent { padding-left:24px; color:var(--text-secondary); }

.hidden { display:none !important; }

/* ── Version Badge ── */
.sidebar-version {
  text-align:center; padding:8px 18px 4px; font-size:11px; font-weight:700;
  color:#d4820a; letter-spacing:0.5px; border-top:1px solid var(--border);
}
.sidebar-version span {
  display:inline-block; padding:3px 10px; border-radius:10px;
  background:rgba(212,130,10,0.12); border:1px solid rgba(212,130,10,0.25);
}

/* ── Login Modal ── */
.login-box-header .login-icon { font-size:36px; margin-bottom:8px; }
.login-box-header h2 { font-size:18px; font-weight:700; color:var(--text-primary); }
.login-box-header p { font-size:12px; color:var(--text-muted); margin-top:4px; }
.login-box-body .form-group { margin-bottom:14px; }
.login-box-body .form-group label { font-size:12px; font-weight:700; color:var(--text-secondary); display:block; margin-bottom:4px; }
.login-box-body .form-group input {
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
  font-size:14px; font-family:inherit; background:var(--bg-input);
}
.login-box-body .form-group input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(212,130,10,0.1); }
.login-error { color:var(--negative); font-size:12px; margin-bottom:8px; min-height:18px; }
.login-box-footer { padding:12px 24px 20px; }
.login-box-footer .btn { width:100%; padding:10px; font-size:14px; justify-content:center; }

/* ── User Management ── */
.user-menu { position:relative; display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
.user-menu .user-avatar {
  width:28px; height:28px; border-radius:50%; background:var(--accent);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700;
}
.user-menu .user-name { font-size:12px; color:var(--text-primary); }
.user-dropdown {
  position:absolute; top:100%; right:0; margin-top:4px; background:var(--bg-card);
  border:1px solid var(--border-light); border-radius:var(--radius); box-shadow:var(--shadow-lg);
  min-width:160px; z-index:50; display:none;
}
.user-dropdown.show { display:block; }
.user-dropdown-item {
  padding:9px 16px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px;
}
.user-dropdown-item:hover { background:var(--bg-input); }
.user-dropdown-item.danger { color:var(--negative); }

/* ── User Table in Modal ── */
.user-table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
.user-table th { background:var(--bg-input); padding:8px 12px; text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-secondary); border-bottom:2px solid var(--border); }
.user-table td { padding:8px 12px; border-bottom:1px solid var(--border-light); }


.org-tree { margin-left:0; }
.org-level { margin-left:20px; margin-bottom:4px; padding:6px 10px; border-left:2px solid var(--accent); font-size:13px; }
.org-level.level-0 { margin-left:0; border-left-color:var(--text-primary); font-weight:700; font-size:15px; }
.org-level.level-1 { border-left-color:var(--accent); font-weight:600; }
.org-level.level-2 { border-left-color:var(--accent-light); }
.org-level.level-3 { border-left-color:var(--text-muted); }
.pay-slip { border:1px solid var(--border); border-radius:var(--radius); padding:24px; max-width:720px; margin:0 auto; }
.pay-slip h2 { text-align:center; margin-bottom:16px; }
.pay-slip table { width:100%; }
.pay-slip .divider td { border-top:2px solid var(--text-primary); }


/* ── Suite shell (V3.0) ── */
.nav-item .nav-lock { display:none; font-size:9px; opacity:.75; margin-left:4px; }
.nav-item.locked { opacity:.55; }
.suite-links { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
.suite-link { display:flex; flex-direction:column; gap:4px; padding:14px; border:1px solid var(--border-light); border-radius:var(--radius); background:var(--bg-card); cursor:pointer; transition:all .15s; }
.suite-link:hover { border-color:var(--accent); }
.suite-link .t { font-size:13px; font-weight:700; color:var(--text-primary); }
.suite-link .d { font-size:11px; color:var(--text-muted); }
.up-panel { max-width:640px; margin:30px auto; }
</style>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>

<script>
/* ═══════════════════════════════════════
   ERP SUITE V3.0 — 財務會計 + 進銷存 + 人力資源
   統一授權計費分級（免費/專業/企業）
   ═══════════════════════════════════════ */
let accounts = [];
let journalEntries = [];
let products = [];
let suppliers = [];
let customers = [];
let purchaseOrders = [];
let salesOrders = [];
let users = [];
let openingBalances = [];
let openingDate = '';
let employees, salaryStructures, attendances, leaves, overtimes, payrollRecords;

let currentUser = null;

const DEFAULT_ACCOUNTS = [
  {id:'aa1',code:'1110',name:'零用金',type:'asset'},
  {id:'aa2',code:'1111',name:'現金',type:'asset'},
  {id:'aa3',code:'1112',name:'銀行存款',type:'asset'},
  {id:'aa4',code:'1112-01',name:'華南銀行存款',type:'asset'},

function updateJeTotals() {
  let dr = 0, cr = 0;
  document.querySelectorAll('#jeLines .entry-line').forEach(el => {
    dr += Number(el.querySelector('.je-debit').value) || 0;
    cr += Number(el.querySelector('.je-credit').value) || 0;
  });
  const drEl = document.getElementById('jeDrTotal');
  const crEl = document.getElementById('jeCrTotal');
  const balEl = document.getElementById('jeBalance');
  if (drEl) drEl.textContent = fmtMoney(dr);
  if (crEl) crEl.textContent = fmtMoney(cr);
  if (balEl) {
    const diff = dr - cr;
    if (diff === 0) balEl.innerHTML = '<span style="color:var(--positive);font-weight:700;">✓ 借貸平衡</span>';
    else balEl.innerHTML = `<span style="color:var(--negative);font-weight:700;">⚠ 差額 ${fmtMoney(Math.abs(diff))}</span>`;
  }
}

function saveJournal() {
  const date = document.getElementById('jeDate').value;
  let voucher = document.getElementById('jeVoucher').value.trim();
  const desc = document.getElementById('jeDesc').value.trim();
  if (!date || !desc) return alert('請填寫日期與摘要');

  const lines = [];
  document.querySelectorAll('#jeLines .entry-line').forEach(el => {
    const acc = el.querySelector('.je-acc').value;
    const debit = Number(el.querySelector('.je-debit').value) || 0;
    const credit = Number(el.querySelector('.je-credit').value) || 0;
    if (acc && (debit > 0 || credit > 0)) lines.push({acc, debit, credit});
  });
  if (lines.length < 2) return alert('至少需兩行分錄');
  const dr = lines.reduce((s,l) => s + l.debit, 0);
  const cr = lines.reduce((s,l) => s + l.credit, 0);
  if (dr !== cr) return alert('借貸不平衡！');

  if (!voucher) {
    const d = new Date(date);
    const prefix = `${d.getFullYear()-1911}${(d.getMonth()+1).toString().padStart(2,'0')}${d.getDate().toString().padStart(2,'0')}`;
    const sameDay = journalEntries.filter(j => j.voucher && j.voucher.startsWith(prefix + '-')).length;
    let seq = sameDay + 1;
    while (journalEntries.some(j => j.voucher === `${prefix}-${String(seq).padStart(3,'0')}`)) seq++;
    voucher = `${prefix}-${String(seq).padStart(3,'0')}`;
    document.getElementById('jeVoucher').value = voucher;
  }

  if (STATE.editingId) {
    const idx = journalEntries.findIndex(j => j.id === STATE.editingId);
    if (idx >= 0) { journalEntries[idx] = {...journalEntries[idx], date, voucher, desc, lines}; }
  } else {
    journalEntries.push({id:genId(), date, voucher, desc, lines});
  }
  save('journalEntries', journalEntries);
  closeModal();
  renderPage();
}

function renderTrialBalance() {

  const balances = {};
  for (const a of accounts) balances[a.id] = 0;
  for (const je of journalEntries) {
    for (const l of je.lines) {
      balances[l.acc] = (balances[l.acc] || 0) + l.debit - l.credit;
    }
  }

  let html = `<div class="card"><div class="card-header"><h2>試算表</h2><span style="font-size:12px;color:var(--text-muted);">餘額式試算表</span></div><div class="card-body">

  let totalDr = 0, totalCr = 0;
  for (const a of accounts) {
    const bal = balances[a.id] || 0;
    // Show all accounts including zero
    const dr = bal > 0 ? bal : 0;
    const cr = bal < 0 ? -bal : 0;
    totalDr += dr; totalCr += cr;
    html += `<tr><td style="font-family:var(--font-mono);font-size:12px;">${a.code}</td>
      <td>${a.name}</td><td><span class="badge badge-success">${accTypeLabel(a.type)}</span></td>
      <td class="num">${dr>0?fmtMoney(dr):''}</td><td class="num credit">${cr>0?fmtMoney(cr):''}</td></tr>`;
  }
  html += `<tr class="total-row"><td colspan="3"><strong>合計</strong></td>
    <td class="num"><strong>${fmtMoney(totalDr)}</strong></td><td class="num credit"><strong>${fmtMoney(totalCr)}</strong></td></tr>`;
  html += `</tbody></table>
    <div style="margin-top:12px;font-size:12px;color:${totalDr===totalCr?'var(--positive)':'var(--negative)'};font-family:var(--font-mono);">

  return html;
}

function sumByPrefix(prefixes, balances) {
  let sum = 0;
  for (const a of accounts) {
    if (prefixes.some(p => a.code.startsWith(p))) {
      const bal = balances[a.id] || 0;
      sum += Math.abs(bal);
    }
  }
  return sum;
}

      <input type="date" id="isTo" value="${to}" style="padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;" onchange="renderPage()">
      ${from||to?`<button class="btn btn-outline btn-xs" onclick="renderPage()">查詢</button>`:''}
      <span style="font-size:12px;color:var(--text-muted);">${from||to?(from||'起始')+'～'+(to||'今日'):'全部期間'}</span>
    </div></div><div class="card-body">`;

    // 營業收入 (code 4 + code 7)
    const opRev = sumByPrefix(['4'], balances);
    const nonOpRev = sumByPrefix(['7'], balances);
    
    html += `<div class="report-section"><h3>營業收入</h3><table class="data-table"><tbody>`;
    for (const a of accounts.filter(x => x.code.startsWith('4'))) {
      const bal = balances[a.id] || 0;
      if (bal === 0) continue;
      html += `<tr><td>${a.name}</td><td class="num">${fmtMoney(Math.abs(bal))}</td></tr>`;
    }
    html += `<tr class="total-row"><td>營業收入合計</td><td class="num">${fmtMoney(opRev)}</td></tr></tbody></table></div>`;

    // 銷貨成本 (code 5)
    const cogs = sumByPrefix(['5'], balances);
    const grossProfit = opRev - cogs;
    
    html += `<div class="report-section"><h3>銷貨成本</h3><table class="data-table"><tbody>`;
    for (const a of accounts.filter(x => x.code.startsWith('5'))) {
      const bal = balances[a.id] || 0;
      if (bal === 0) continue;
      html += `<tr><td>${a.name}</td><td class="num credit">${fmtMoney(Math.abs(bal))}</td></tr>`;
    }
    html += `<tr class="total-row"><td>銷貨成本合計</td><td class="num credit">${fmtMoney(cogs)}</td></tr></tbody></table></div>`;
    html += `<div class="report-section"><div class="kpi-card"><div class="kpi-label">營業毛利</div><div class="kpi-value ${grossProfit>=0?'positive':'negative'}">${fmtMoney(grossProfit)}</div></div></div>`;

    // 營業費用 (code 6)
    const opExp = sumByPrefix(['6'], balances);
    const opNet = grossProfit - opExp;
    
    html += `<div class="report-section"><h3>營業費用</h3><table class="data-table"><tbody>`;
    for (const a of accounts.filter(x => x.code.startsWith('6'))) {
      const bal = balances[a.id] || 0;
      if (bal === 0) continue;
      html += `<tr><td>${a.name}</td><td class="num credit">${fmtMoney(Math.abs(bal))}</td></tr>`;
    }
    html += `<tr class="total-row"><td>營業費用合計</td><td class="num credit">${fmtMoney(opExp)}</td></tr></tbody></table></div>`;
    html += `<div class="report-section"><div class="kpi-card"><div class="kpi-label">營業淨利</div><div class="kpi-value ${opNet>=0?'positive':'negative'}">${fmtMoney(opNet)}</div></div></div>`;

    // 非營業收入 (code 7)
    if (nonOpRev > 0) {
      html += `<div class="report-section"><h3>非營業收入</h3><table class="data-table"><tbody>`;
      for (const a of accounts.filter(x => x.code.startsWith('7'))) {
        const bal = balances[a.id] || 0;
        if (bal === 0) continue;
        html += `<tr><td>${a.name}</td><td class="num">${fmtMoney(Math.abs(bal))}</td></tr>`;
      }
      html += `<tr class="total-row"><td>非營業收入合計</td><td class="num">${fmtMoney(nonOpRev)}</td></tr></tbody></table></div>`;
    }

    // 非營業費用 (code 8-9)
    const nonOpExp = sumByPrefix(['8','9'], balances);
    if (nonOpExp > 0) {
      html += `<div class="report-section"><h3>非營業費用</h3><table class="data-table"><tbody>`;
      for (const a of accounts.filter(x => x.code.startsWith('8') || x.code.startsWith('9'))) {
        const bal = balances[a.id] || 0;
        if (bal === 0) continue;
        html += `<tr><td>${a.name}</td><td class="num credit">${fmtMoney(Math.abs(bal))}</td></tr>`;
      }
      html += `<tr class="total-row"><td>非營業費用合計</td><td class="num credit">${fmtMoney(nonOpExp)}</td></tr></tbody></table></div>`;
    }

    const netIncome2 = opNet + nonOpRev - nonOpExp;
    html += `<div class="report-section"><h3>本期損益</h3>
      <div class="kpi-card" style="margin-top:8px;"><div class="kpi-label">本期淨利（損）</div>
      <div class="kpi-value ${netIncome2>=0?'positive':'negative'}">${fmtMoney(netIncome2)}</div></div></div>`;
  } else {
    const year = Number(document.getElementById('isYear')?.value) || now.getFullYear();
    html += `<select id="isYear" style="padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;" onchange="renderPage()">`;
    for (let y = now.getFullYear(); y >= now.getFullYear() - 10; y--) {
      html += `<option value="${y}"${year===y?' selected':''}>${y} 年</option>`;
    }
    html += `</select></div></div><div class="card-body" style="overflow-x:auto;">`;

    // Build monthly balances
    const months = [];
    for (let m = 1; m <= 12; m++) {
      const from = `${year}-${String(m).padStart(2,'0')}-01`;
      const to = `${year}-${String(m).padStart(2,'0')}-${new Date(year,m,0).getDate()}`;
      months.push({ m, from, to, balances: getBalancesForPeriod(from, to) });
    }
    const yearBalances = getBalancesForPeriod(`${year}-01-01`, `${year}-12-31`);
    const revAccounts = accounts.filter(a => a.type === 'revenue');
    const expAccounts = accounts.filter(a => a.type === 'expense');

    html += `<table class="data-table" style="font-size:11px;min-width:900px;"><thead><tr><th>科目</th>`;
    for (let m = 1; m <= 12; m++) html += `<th class="num">${m}月</th>`;
    html += `<th class="num">年度合計</th></tr></thead><tbody>`;

    // Revenue rows
    html += `<tr style="background:var(--bg-input);"><td colspan="14" style="font-weight:700;font-size:12px;">營業收入</td></tr>`;
    for (const a of revAccounts) {
      if (Math.abs(yearBalances[a.id] || 0) === 0) continue;
      html += `<tr><td>${a.name}</td>`;
      for (const mo of months) {
        const bal = Math.abs(mo.balances[a.id] || 0);
        html += `<td class="num">${bal ? fmtMoney(bal) : ''}</td>`;
      }
      html += `<td class="num" style="font-weight:600;">${fmtMoney(Math.abs(yearBalances[a.id] || 0))}</td></tr>`;
    }
    html += `<tr class="total-row"><td>收入合計</td>`;
    for (const mo of months) {
      html += `<td class="num">${fmtMoney(sumByType('revenue', mo.balances))}</td>`;
    }
    html += `<td class="num">${fmtMoney(sumByType('revenue', yearBalances))}</td></tr>`;

    // Expense rows
    html += `<tr style="background:var(--bg-input);"><td colspan="14" style="font-weight:700;font-size:12px;">營業成本與費用</td></tr>`;
    for (const a of expAccounts) {
      const yb = Math.abs(yearBalances[a.id] || 0);
      // Show all accounts including zero
      html += `<tr><td>${a.name}</td>`;
      for (const mo of months) {
        const bal = Math.abs(mo.balances[a.id] || 0);
        html += `<td class="num credit">${bal ? fmtMoney(bal) : ''}</td>`;
      }
      html += `<td class="num credit" style="font-weight:600;">${fmtMoney(yb)}</td></tr>`;
    }
    html += `<tr class="total-row"><td>費用合計</td>`;
    for (const mo of months) {
      html += `<td class="num credit">${fmtMoney(sumByType('expense', mo.balances))}</td>`;
    }
    html += `<td class="num credit">${fmtMoney(sumByType('expense', yearBalances))}</td></tr>`;

    // Net income row
    html += `<tr style="background:#fef9e7;font-weight:700;"><td>本期淨利（損）</td>`;
    for (const mo of months) {
      const net = sumByType('revenue', mo.balances) - sumByType('expense', mo.balances);
      html += `<td class="num" style="color:${net>=0?'var(--positive)':'var(--negative)'};">${fmtMoney(net)}</td>`;
    }
    const netYear = sumByType('revenue', yearBalances) - sumByType('expense', yearBalances);
    html += `<td class="num" style="color:${netYear>=0?'var(--positive)':'var(--negative)'};">${fmtMoney(netYear)}</td></tr>`;

    html += `</tbody></table>`;
  }

  html += `</div></div>`;
  return html;
}

function renderBalanceSheet() {
  const asOf = document.getElementById('bsDate')?.value || new Date().toISOString().split('T')[0];
  const balances = getBalancesAsOf(asOf);
  const company = (STATE.license && STATE.license.company) || '';
  let html = `<div class="card"><div class="card-header"><h2>${company?company+' — ':''}資產負債表</h2><span style="font-size:12px;color:var(--text-muted);"><input type="date" id="bsDate" value="${asOf}" style="padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;" onchange="renderPage()"></span></div><div class="card-body">`;

  // Assets (with contra-asset handling for 累計折舊, 備抵)
  html += `<div class="report-section"><h3>資產</h3><table class="data-table"><tbody>`;
  let totalAssets = 0;
  const assetAccounts = accounts.filter(x=>x.type==='asset');
  for (let i = 0; i < assetAccounts.length; i++) {
    const a = assetAccounts[i];
    const bal = balances[a.id] || 0;
    const isContra = a.name.includes('累計折舊') || a.name.includes('備抵') || a.name.includes('跌價損失準備');
    if (isContra) {
      const absBal = Math.abs(bal);
      if (absBal === 0) continue;
      totalAssets -= absBal;
      html += `<tr style="color:var(--text-muted);"><td>　減：${a.name}</td><td class="num">(${fmtMoney(absBal)})</td></tr>`;
    } else {
      if (bal === 0) continue;
      totalAssets += bal;
      html += `<tr><td>${a.name}</td><td class="num">${fmtMoney(bal)}</td></tr>`;
    }
  }
  html += `<tr class="total-row"><td>資產合計</td><td class="num">${fmtMoney(totalAssets)}</td></tr></tbody></table></div>`;

  // Liabilities
  html += `<div class="report-section"><h3>負債</h3><table class="data-table"><tbody>`;
  let totalLiabilities = 0;
  for (const a of accounts.filter(x=>x.type==='liability')) {
    const bal = -(balances[a.id] || 0);
    // Show all accounts including zero
    totalLiabilities += bal;
    html += `<tr><td>${a.name}</td><td class="num credit">${fmtMoney(bal)}</td></tr>`;
  }
  html += `<tr class="total-row"><td>負債合計</td><td class="num credit">${fmtMoney(totalLiabilities)}</td></tr></tbody></table></div>`;

  // Equity
  html += `<div class="report-section"><h3>權益</h3><table class="data-table"><tbody>`;
  let totalEquity = 0;
  for (const a of accounts.filter(x=>x.type==='equity')) {
    const bal = -(balances[a.id] || 0);
    // Show all accounts including zero
    totalEquity += bal;
    html += `<tr><td>${a.name}</td><td class="num">${fmtMoney(bal)}</td></tr>`;
  }
  html += `<tr class="total-row"><td>權益合計</td><td class="num">${fmtMoney(totalEquity)}</td></tr></tbody></table></div>`;

  html += `<div style="margin-top:12px;font-size:12px;font-family:var(--font-mono);color:${Math.abs(totalAssets-(totalLiabilities+totalEquity))<1?'var(--positive)':'var(--negative)'};">
    資產 = 負債 + 權益：${fmtMoney(totalAssets)} = ${fmtMoney(totalLiabilities)} + ${fmtMoney(totalEquity)}
    ${Math.abs(totalAssets-(totalLiabilities+totalEquity))<1?' ✓':' ⚠'}
    </div></div></div>`;
  return html;
}

function getBalancesForPeriod(from, to) {
  // V2.1：from 早於開帳日時自動含期初餘額，避免損益表與資產負債表金額斷裂
  const balances = {};
  for (const a of accounts) balances[a.id] = 0;
  const includeOpening = openingDate && openingBalances.length > 0 && (!from || from <= openingDate);
  if (includeOpening) {
    for (const ob of openingBalances) balances[ob.acc] = (balances[ob.acc] || 0) + ob.debit - ob.credit;
  }
  for (const je of journalEntries) {
    if (from && je.date < from) continue;
    if (to && je.date > to) continue;
    for (const l of je.lines) {
      balances[l.acc] = (balances[l.acc] || 0) + l.debit - l.credit;
    }
  }
  return balances;
}

function sumByType(type, balances) {
  let sum = 0;
  for (const a of accounts.filter(x => x.type === type)) {
    const bal = balances[a.id] || 0;
    if (type === 'revenue' || type === 'equity' || type === 'liability') sum += -bal;
    else sum += bal;
  }
  return Math.abs(sum);
}

async function loadOpeningBalances(){ const d=await load('openingBalances',[]); if(d&&d.length>0) openingBalances=d; const od=await load('openingDate',[]); if(od&&od.length>0) openingDate=od[0].date||''; }

function getBalancesAsOf(asOfDate){
  const balances={}; for(const a of accounts) balances[a.id]=0;
  if(openingDate&&openingBalances.length>0&&(!asOfDate||asOfDate>=openingDate)){ for(const ob of openingBalances) balances[ob.acc]=(balances[ob.acc]||0)+ob.debit-ob.credit; }
  const sd=openingDate||'0000-01-01';
  for(const je of journalEntries){ if(je.date<sd)continue; if(asOfDate&&je.date>asOfDate)continue; for(const l of je.lines) balances[l.acc]=(balances[l.acc]||0)+l.debit-l.credit; }
  return balances;
}

  // V2.1：統一改用 getBalancesAsOf（含期初餘額），與資產負債表口徑一致
  return getBalancesAsOf('');
}

function saveProduct() {
  const code = document.getElementById('prodCode').value.trim();
  const name = document.getElementById('prodName').value.trim();
  if (!code || !name) return alert('請填寫代碼與名稱');
  const data = {
    id: STATE.editingId || genId(),
    code, name,
    unit: document.getElementById('prodUnit').value,
    cost: Number(document.getElementById('prodCost').value) || 0,
    sale: Number(document.getElementById('prodSale').value) || 0,
    stock: STATE.editingId ? (products.find(p=>p.id===STATE.editingId)?.stock||0) : 0,
    minStock: Number(document.getElementById('prodMinStock').value) || 0,
  };
  if (STATE.editingId) {

  closeModal();
  renderPage();

function deleteProduct(id) {

  products = products.filter(p => p.id !== id);
  save('products', products);
  renderPage();
}

function savePurchase() {
  const date = document.getElementById('poDate').value;
  const supplierId = document.getElementById('poSupplier').value;
  let poNo = document.getElementById('poNo').value.trim();
  if (!date || !supplierId) return alert('請填寫日期與供應商');

  const lines = [];
  document.querySelectorAll('#poLines .entry-line').forEach(el => {
    const prod = el.querySelector('.po-prod').value;
    const qty = Number(el.querySelector('.po-qty').value) || 0;
    const price = Number(el.querySelector('.po-price').value) || 0;
    if (prod && qty > 0) lines.push({prod, qty, price});
  });
  if (lines.length === 0) return alert('至少需一個進貨品項');

  if (!poNo) {
    const d = new Date(date);
    poNo = `PO${d.getFullYear()}${(d.getMonth()+1).toString().padStart(2,'0')}${d.getDate().toString().padStart(2,'0')}-${String(purchaseOrders.length+1).padStart(3,'0')}`;
  }

  // Update stock（V2.1：編輯時以差額調整）
  if (!STATE.editingId) {
    for (const l of lines) {
      const prod = products.find(p => p.id === l.prod);
      if (prod) prod.stock += l.qty;
    }
  } else {
    const old = purchaseOrders.find(x => x.id === STATE.editingId);
    if (old) {
      const oldMap = {};
      old.lines.forEach(l => { oldMap[l.prod] = (oldMap[l.prod]||0) + l.qty; });
      lines.forEach(l => { oldMap[l.prod] = (oldMap[l.prod]||0) - l.qty; });
      for (const pid in oldMap) {
        const prod = products.find(p => p.id === pid);
        if (prod) prod.stock = Math.max(0, prod.stock + oldMap[pid]);
      }
    }
  }
  save('products', products);

  const data = {id: STATE.editingId || genId(), date, poNo, supplierId, status:'已完成', lines};
  if (STATE.editingId) {
    const idx = purchaseOrders.findIndex(x => x.id === STATE.editingId);
    if (idx >= 0) purchaseOrders[idx] = data;
  } else { purchaseOrders.push(data); }
  save('purchaseOrders', purchaseOrders);
  closeModal();
  renderPage();
}

async function deletePurchase(id) {
  if (!confirm('確定刪除此進貨單？庫存將自動扣回。')) return;

    await save('products', products);
  }
  purchaseOrders = purchaseOrders.filter(x => x.id !== id);
  await save('purchaseOrders', purchaseOrders);
  renderPage();
}

function saveSales() {
  const date = document.getElementById('soDate').value;
  const customerId = document.getElementById('soCustomer').value;
  let soNo = document.getElementById('soNo').value.trim();
  if (!date || !customerId) return alert('請填寫日期與客戶');

  const lines = [];
  document.querySelectorAll('#soLines .entry-line').forEach(el => {
    const prod = el.querySelector('.so-prod').value;
    const qty = Number(el.querySelector('.so-qty').value) || 0;
    const price = Number(el.querySelector('.so-price').value) || 0;
    if (prod && qty > 0) lines.push({prod, qty, price});
  });
  if (lines.length === 0) return alert('至少需一個銷貨品項');

  // Check stock（V2.1：編輯時併計舊單可釋放數量）
  const editRelease = {};
  if (STATE.editingId) {
    const old = salesOrders.find(x => x.id === STATE.editingId);
    if (old) old.lines.forEach(l => { editRelease[l.prod] = (editRelease[l.prod]||0) + l.qty; });
  }
  for (const l of lines) {
    const prod = products.find(p => p.id === l.prod);
    const avail = (prod ? prod.stock : 0) + (editRelease[l.prod] || 0);
    if (prod && avail < l.qty) {
      return alert(`${prod.name} 庫存不足！（目前可用：${avail}，需要：${l.qty}）`);
    }
  }

  if (!soNo) {
    const d = new Date(date);
    soNo = `SO${d.getFullYear()}${(d.getMonth()+1).toString().padStart(2,'0')}${d.getDate().toString().padStart(2,'0')}-${String(salesOrders.length+1).padStart(3,'0')}`;
  }

  // Deduct stock（V2.1：編輯時以差額調整）
  if (!STATE.editingId) {
    for (const l of lines) {
      const prod = products.find(p => p.id === l.prod);
      if (prod) prod.stock -= l.qty;
    }
  } else {
    const old = salesOrders.find(x => x.id === STATE.editingId);
    if (old) {
      const oldMap = {};
      old.lines.forEach(l => { oldMap[l.prod] = (oldMap[l.prod]||0) + l.qty; });
      lines.forEach(l => { oldMap[l.prod] = (oldMap[l.prod]||0) - l.qty; });
      for (const pid in oldMap) {
        const prod = products.find(p => p.id === pid);
        if (prod) prod.stock = Math.max(0, prod.stock + oldMap[pid]);
      }
    }
  }
  save('products', products);

  const data = {id: STATE.editingId || genId(), date, soNo, customerId, status:'已完成', lines};
  if (STATE.editingId) {
    const idx = salesOrders.findIndex(x => x.id === STATE.editingId);
    if (idx >= 0) salesOrders[idx] = data;
  } else { salesOrders.push(data); }
  save('salesOrders', salesOrders);
  closeModal();
  renderPage();
}

function renderInventory() {
  const totalValue = products.reduce((s,p) => s + p.stock * p.cost, 0);
  const lowStock = products.filter(p => p.stock > 0 && p.stock <= p.minStock).length;
  const outOfStock = products.filter(p => p.stock <= 0).length;

  let html = `<div class="kpi-row">
    <div class="kpi-card"><div class="kpi-label">庫存商品數</div><div class="kpi-value neutral">${products.length}</div></div>
    <div class="kpi-card"><div class="kpi-label">庫存總價值</div><div class="kpi-value neutral">${fmtMoney(totalValue)}</div></div>
    <div class="kpi-card"><div class="kpi-label">低於安全存量</div><div class="kpi-value ${lowStock>0?'negative':'positive'}">${lowStock}</div></div>
    <div class="kpi-card"><div class="kpi-label">缺貨品項</div><div class="kpi-value ${outOfStock>0?'negative':'positive'}">${outOfStock}</div></div>
  </div>`;

  html += `<div class="card"><div class="card-header"><h2>庫存查詢</h2>
    <input class="search-input" id="invSearch" placeholder="搜尋商品..." oninput="renderPage()"></div><div class="card-body">`;

  const q = (document.getElementById('invSearch')?.value || '').toLowerCase();
  const filtered = q ? products.filter(p => p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q)) : products;

  html += `<table class="data-table"><thead><tr><th>代碼</th><th>商品名稱</th><th class="num">庫存數量</th><th>單位</th><th class="num">成本單價</th><th class="num">庫存金額</th><th>狀態</th></tr></thead><tbody>`;
  for (const p of filtered) {
    const statusClass = p.stock <= 0 ? 'badge-danger' : (p.stock <= p.minStock ? 'badge-warning' : 'badge-success');
    const statusText = p.stock <= 0 ? '缺貨' : (p.stock <= p.minStock ? '⚠ 低於安全存量' : '正常');
    html += `<tr><td style="font-family:var(--font-mono);font-size:12px;">${p.code}</td><td>${p.name}</td>
      <td class="num" style="font-weight:700;font-size:15px;">${p.stock}</td><td>${p.unit}</td>
      <td class="num">${fmtMoney(p.cost)}</td><td class="num">${fmtMoney(p.stock*p.cost)}</td>
      <td><span class="badge ${statusClass}">${statusText}</span></td></tr>`;
  }
  html += `</tbody></table></div></div>`;
  return html;
}

function ensureXLSX(){ if(typeof XLSX==='undefined'){ alert('Excel 元件尚未載入成功。\n若以 file:// 直接開啟本頁且無網路，請改用「啟動ERP.bat」或 exe 版本（內建離線 Excel 元件）。'); return false; } return true; }

function expXLSX(data, fn) { if(!ensureXLSX())return; if(!data||data.length===0){alert('無資料可匯出');return;} const ws=XLSX.utils.json_to_sheet(data); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Sheet1'); XLSX.writeFile(wb,fn+'.xlsx'); }

function impXLSX(cb) { if(!ensureXLSX())return; const i=document.createElement('input'); i.type='file'; i.accept='.xlsx,.xls'; i.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{ try{ const wb=XLSX.read(ev.target.result,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]]; const d=XLSX.utils.sheet_to_json(ws); if(d.length===0){alert('無資料');return;} cb(d); }catch(err){alert('讀取失敗:'+err.message);} }; r.readAsArrayBuffer(f); }; i.click(); }

function importOpeningBalances(){ impXLSX(async data=>{
  const date = data.length>0 && data[0].日期 ? String(data[0].日期).substring(0,10) : new Date().toISOString().split('T')[0];
  const obs = []; let totalDr = 0, totalCr = 0;
  data.forEach(r=>{
    if(!r.科目) return;
    const accId = accounts.find(a=>r.科目&&(a.code+' '+a.name===r.科目||a.name===r.科目||a.code===r.科目));
    if(!accId) return;
    const dr = Number(r.借方金額)||0;
    const cr = Number(r.貸方金額)||0;
    obs.push({acc:accId.id, debit:dr, credit:cr});
    totalDr += dr; totalCr += cr;
  });
  if(obs.length===0){ alert('無有效科目資料'); return; }
  openingBalances = obs;
  openingDate = date;
  await save('openingBalances', openingBalances);
  await save('openingDate', [{id:'od',date:date}]);
  // Auto-generate opening journal entry
  const voucher = date.replace(/-/g,'').slice(2)+'-OPEN';
  const lines = obs.filter(o=>o.debit>0||o.credit>0).map(o=>({acc:o.acc, debit:o.debit, credit:o.credit}));
  const diff = totalDr - totalCr;
  if(Math.abs(diff)>0.5){
    // V2.1：差額自動入「累積盈虧(3252)」，找不到則找 3251 前期損益，最後 fallback 權益第一個科目
    let plAcc = accounts.find(a=>a.code==='3252') || accounts.find(a=>a.code==='3251') || accounts.find(a=>a.type==='equity');
    if(plAcc){
      if(diff > 0) lines.push({acc:plAcc.id, debit:0, credit:diff});
      else lines.push({acc:plAcc.id, debit:-diff, credit:0});
    }
  }
  const je = {id:genId(), date, voucher, desc:'期初開帳', lines};
  const idx = journalEntries.findIndex(j=>j.voucher===voucher);
  if(idx>=0) journalEntries[idx]=je; else journalEntries.push(je);
  await save('journalEntries', journalEntries);
  alert('已匯入 '+obs.length+' 筆期初餘額（日期：'+date+'）\n開帳傳票：'+voucher);
  renderPage();
}); }

async function clearOpeningBalances(){
  if(!confirm('確定清除期初餘額？將同時刪除開帳傳票。')) return;
  const voucherPrefix = (openingDate||'').replace(/-/g,'').slice(2)+'-OPEN';
  journalEntries = journalEntries.filter(j => j.voucher !== voucherPrefix);
  openingBalances = [];
  openingDate = '';
  await save('openingBalances', []);
  await save('openingDate', []);
  await save('journalEntries', journalEntries);
  renderPage();
}

    html += '<tr><td colspan="2" style="background:#f0f0f0;font-weight:700;text-align:center;">營業成本與費用</td></tr>';

    html += '<tr class="total"><td>費用合計</td><td>' + sumByType('expense', balances).toLocaleString() + '</td></tr>';

    html += '<tr class="total"><td>本期淨利（損）</td><td>' + net.toLocaleString() + '</td></tr>';
  } else {
    html += '<h2>' + year + ' 年度各月損益比較表</h2>';
    html += '<table><tr><th>月份</th><th>營業收入</th><th>營業費用</th><th>本期淨利</th></tr>';
    let tr=0, te=0;
    for (let m = 1; m <= 12; m++) {
      const from = year + '-' + String(m).padStart(2,'0') + '-01';
      const to = year + '-' + String(m).padStart(2,'0') + '-' + new Date(year,m,0).getDate();
      const b = getBalancesForPeriod(from, to);
      const r = sumByType('revenue', b), e = sumByType('expense', b);
      tr+=r; te+=e;
      html += '<tr><td>' + m + '月</td><td>' + r.toLocaleString() + '</td><td>' + e.toLocaleString() + '</td><td style="color:' + (r>=e?'#1b7d46':'#c0392b') + ';">' + (r-e).toLocaleString() + '</td></tr>';

  }
  html += '</table></body></html>';
  printWin.document.write(html);
  printWin.document.close();
  setTimeout(() => printWin.print(), 500);

function kpiSafeDiv(a, b) { return (b && b !== 0 && isFinite(a/b)) ? a/b : null; }

function kpiBsAgg(balances) {
  let totalAssets=0, currentAssets=0, inventory=0, receivables=0, totalLiab=0, currentLiab=0, equity=0;
  for (const a of accounts) {
    const bal = balances[a.id] || 0;
    const contra = a.name.includes('累計折舊') || a.name.includes('備抵') || a.name.includes('跌價損失準備');
    if (a.type === 'asset') {
      const v = contra ? -Math.abs(bal) : bal;
      totalAssets += v;
      if (a.code.startsWith('11')) {
        currentAssets += v;
        if (a.code.startsWith('113')) inventory += v;
        if (a.code.startsWith('112')) receivables += v;
      }
    } else if (a.type === 'liability') {
      const v = -bal; totalLiab += v;
      if (a.code.startsWith('21')) currentLiab += v;
    } else if (a.type === 'equity') {
      equity += -bal;
    }
  }
  return { totalAssets, currentAssets, inventory, receivables, totalLiab, currentLiab, equity };
}

function kpiYearPnl(y) {
  const b = getBalancesForPeriod(`${y}-01-01`, `${y}-12-31`);
  return {
    rev: sumByPrefix(['4'], b),
    cogs: sumByPrefix(['5'], b),
    opex: sumByPrefix(['6'], b),
    net: sumByType('revenue', b) - sumByType('expense', b),
  };
}

function kpiRawVals(y) {
  const pnl = kpiYearPnl(y);
  const end = kpiBsAgg(getBalancesAsOf(`${y}-12-31`));
  // 期初：開帳日在分析年度內時，以開帳日餘額為期初（公司最早財務狀態）
  const begAsOf = (openingDate && openingDate > `${y-1}-12-31` && openingDate <= `${y}-12-31`) ? openingDate : `${y-1}-12-31`;
  const beg = kpiBsAgg(getBalancesAsOf(begAsOf));
  const avg = (a,b) => (a+b)/2;
  const P = (a,b) => { const v = kpiSafeDiv(a,b); return v===null ? null : v*100; };
  const avgInv = avg(beg.inventory, end.inventory);
  const avgAR  = avg(beg.receivables, end.receivables);
  const avgTA  = avg(beg.totalAssets, end.totalAssets);
  return {
    pnl, end, beg,
    gm:  P(pnl.rev - pnl.cogs, pnl.rev),
    om:  P(pnl.rev - pnl.cogs - pnl.opex, pnl.rev),
    nm:  P(pnl.net, pnl.rev),
    exp: P(pnl.opex, pnl.rev),
    cr:  P(end.currentAssets, end.currentLiab),
    qr:  P(end.currentAssets - end.inventory, end.currentLiab),
    dr:  P(end.totalLiab, end.totalAssets),
    invT: avgInv > 0 ? kpiSafeDiv(pnl.cogs, avgInv) : null,
    arT:  avgAR  > 0 ? kpiSafeDiv(pnl.rev, avgAR)  : null,
    taT:  avgTA  > 0 ? kpiSafeDiv(pnl.rev, avgTA)  : null,
  };
}

function kpiScore(val, best, worst, hi) {
  if (val === null || val === undefined || isNaN(val)) return null;
  let s = hi ? (val - worst) / (best - worst) : (worst - val) / (worst - best);
  return Math.max(0, Math.min(100, Math.round(s * 100)));
}

function kpiGradeOf(score) {
  if (score === null || score === undefined) return { label: '—', cls: 'badge', color: '#8b949e' };
  if (score >= 80) return { label: '優', cls: 'badge-success', color: '#1b7d46' };
  if (score >= 65) return { label: '佳', cls: 'badge-success', color: '#4a9d5f' };
  if (score >= 50) return { label: '中', cls: 'badge-warning', color: '#d4820a' };
  if (score >= 35) return { label: '弱', cls: 'badge-warning', color: '#e67e22' };
  return { label: '危', cls: 'badge-danger', color: '#c0392b' };
}

function kpiCompositeGrade(s) {
  if (s >= 80) return { label: '優良', color: '#1b7d46', note: '整體經營健全，獲利與財務結構均佳。' };
  if (s >= 65) return { label: '穩健', color: '#4a9d5f', note: '經營體質良好，少數指標仍有成長空間。' };
  if (s >= 50) return { label: '尚可', color: '#d4820a', note: '營運正常，建議針對弱項指標優先改善。' };
  if (s >= 35) return { label: '待改善', color: '#e67e22', note: '多項指標偏弱，需檢視成本與財務結構。' };
  return { label: '風險', color: '#c0392b', note: '經營風險偏高，建議儘速檢討損益與資金調度。' };
}

function kpiFmtV(v, unit) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return `${v.toFixed(1)} ${unit}`;
}

function computeKpiIndex(year) {
  const y = Number(year) || new Date().getFullYear();
  const cur = kpiRawVals(y);
  const prv = kpiRawVals(y - 1);
  const revG = prv.pnl.rev > 0 ? (cur.pnl.rev - prv.pnl.rev) / prv.pnl.rev * 100 : null;
  const netG = prv.pnl.net > 0 ? (cur.pnl.net - prv.pnl.net) / prv.pnl.net * 100 : null;
  const M = [
    { g:'獲利能力', name:'毛利率', key:'gm',  unit:'%',  best:35,   worst:2,    hi:true,  bm:'買賣業常見 15～30%' },
    { g:'獲利能力', name:'營業利益率', key:'om',  unit:'%',  best:15,   worst:0,    hi:true,  bm:'常見 3～10%' },
    { g:'獲利能力', name:'純益率', key:'nm',  unit:'%',  best:12,   worst:-5,   hi:true,  bm:'常見 3～8%（含業外損益）' },
    { g:'償債安全', name:'流動比率', key:'cr',  unit:'%',  best:250,  worst:50,   hi:true,  bm:'≥ 200% 為佳' },
    { g:'償債安全', name:'速動比率', key:'qr',  unit:'%',  best:150,  worst:20,   hi:true,  bm:'≥ 100% 為佳' },
    { g:'償債安全', name:'負債比率', key:'dr',  unit:'%',  best:35,   worst:85,   hi:false, bm:'≤ 50% 為佳' },
    { g:'經營效率', name:'存貨週轉率', key:'invT', unit:'次', best:12,   worst:1,    hi:true,  bm:'6～12 次/年' },
    { g:'經營效率', name:'應收帳款週轉率', key:'arT',  unit:'次', best:12,   worst:2,    hi:true,  bm:'8～12 次/年' },
    { g:'經營效率', name:'總資產週轉率', key:'taT',  unit:'次', best:2.5,  worst:0.4,  hi:true,  bm:'1.5～2.5 次/年' },
    { g:'成長性', name:'營收成長率', key:'revG', unit:'%',  best:20,   worst:-15,  hi:true,  bm:'與上年度比較' },
    { g:'成長性', name:'淨利成長率', key:'netG', unit:'%',  best:20,   worst:-15,  hi:true,  bm:'與上年度比較' },
  ];
  const vmap = { gm:cur.gm, om:cur.om, nm:cur.nm, cr:cur.cr, qr:cur.qr, dr:cur.dr, invT:cur.invT, arT:cur.arT, taT:cur.taT, revG, netG };
  for (const m of M) { m.v = vmap[m.key]; m.score = kpiScore(m.v, m.best, m.worst, m.hi); }
  const groups = [
    { name:'獲利能力', weight:0.35 },
    { name:'償債安全', weight:0.25 },
    { name:'經營效率', weight:0.25 },
    { name:'成長性', weight:0.15 },
  ];
  for (const g of groups) {
    const arr = M.filter(m => m.g === g.name && m.score !== null);
    g.score = arr.length ? Math.round(arr.reduce((s,m)=>s+m.score,0) / arr.length) : null;
    g.n = arr.length;
  }
  const wg = groups.filter(g => g.score !== null);
  const wsum = wg.reduce((s,g)=>s+g.weight, 0);
  const composite = wsum > 0 ? Math.round(wg.reduce((s,g)=>s+g.score*g.weight,0) / wsum) : null;
  const prevMap = { gm:prv.gm, om:prv.om, nm:prv.nm, cr:prv.cr, qr:prv.qr, dr:prv.dr, invT:prv.invT, arT:prv.arT, taT:prv.taT, revG:null, netG:null };
  return { year:y, pnl:cur.pnl, expRate:cur.exp, metrics:M, groups, composite, prevMap,
           hasData: journalEntries.length > 0 || openingBalances.length > 0 };
}

function kpiGaugeSVG(score) {
  const g = kpiCompositeGrade(score);
  return `<svg viewBox="0 0 200 122" style="width:100%;max-width:240px;display:block;margin:0 auto;">
    <path d="M 20 110 A 80 80 0 0 1 180 110" fill="none" stroke="#e9e6df" stroke-width="15" stroke-linecap="round" pathLength="100"/>
    <path d="M 20 110 A 80 80 0 0 1 180 110" fill="none" stroke="${g.color}" stroke-width="15" stroke-linecap="round" pathLength="100" stroke-dasharray="${score} 100"/>
    <text x="100" y="86" text-anchor="middle" font-size="38" font-weight="800" fill="${g.color}" font-family="Consolas,monospace">${score}</text>
    <text x="100" y="105" text-anchor="middle" font-size="10" fill="#8b949e">綜合經營指數（滿分 100）</text>
  </svg>`;
}

function kpiRadarSVG(groups) {
  const cx=140, cy=122, R=76;
  const ang = i => -Math.PI/2 + i*(2*Math.PI/groups.length);
  const ring = k => groups.map((g,i)=>`${(cx+R*k/100*Math.cos(ang(i))).toFixed(1)},${(cy+R*k/100*Math.sin(ang(i))).toFixed(1)}`).join(' ');
  let s = `<svg viewBox="0 0 280 240" style="width:100%;max-width:300px;display:block;margin:0 auto;">`;
  for (const k of [25,50,75,100]) s += `<polygon points="${ring(k)}" fill="none" stroke="#e9e6df" stroke-width="1"/>`;
  groups.forEach((g,i)=>{
    s += `<line x1="${cx}" y1="${cy}" x2="${(cx+R*Math.cos(ang(i))).toFixed(1)}" y2="${(cy+R*Math.sin(ang(i))).toFixed(1)}" stroke="#e9e6df" stroke-width="1"/>`;
  });
  const pts = groups.map((g,i)=>{
    const r = R * (g.score===null?0:g.score)/100;
    return `${(cx+r*Math.cos(ang(i))).toFixed(1)},${(cy+r*Math.sin(ang(i))).toFixed(1)}`;
  }).join(' ');
  s += `<polygon points="${pts}" fill="rgba(212,130,10,0.18)" stroke="#d4820a" stroke-width="2"/>`;
  groups.forEach((g,i)=>{
    const r = R * (g.score===null?0:g.score)/100;
    s += `<circle cx="${(cx+r*Math.cos(ang(i))).toFixed(1)}" cy="${(cy+r*Math.sin(ang(i))).toFixed(1)}" r="3" fill="#d4820a"/>`;
  });
  const labels = ['獲利能力','償債安全','經營效率','成長性'];
  groups.forEach((g,i)=>{
    const a = ang(i), lx = cx + (R+18)*Math.cos(a), ly = cy + (R+18)*Math.sin(a);
    const anchor = Math.abs(Math.cos(a)) < 0.3 ? 'middle' : (Math.cos(a) > 0 ? 'start' : 'end');
    const vtxt = g.score===null ? '無資料' : `${g.score} 分`;
    const vcol = g.score===null ? '#8b949e' : '#1b7d46';
    s += `<text x="${lx.toFixed(1)}" y="${(ly-3).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="#37352f">${labels[i]}</text>`;
    s += `<text x="${lx.toFixed(1)}" y="${(ly+9).toFixed(1)}" text-anchor="${anchor}" font-size="10" fill="${vcol}">${vtxt}</text>`;
  });
  s += `</svg>`;
  return s;
}

function kpiTrendSVG(year) {
  const months = [];
  for (let m=1; m<=12; m++) {
    const from = `${year}-${String(m).padStart(2,'0')}-01`;
    const to = `${year}-${String(m).padStart(2,'0')}-${new Date(year,m,0).getDate()}`;
    const b = getBalancesForPeriod(from, to);
    months.push({ m, rev: sumByPrefix(['4'], b), net: sumByType('revenue', b) - sumByType('expense', b) });
  }
  let maxPos = 1, maxNeg = 0;
  months.forEach(mo => { maxPos = Math.max(maxPos, mo.rev, mo.net); maxNeg = Math.max(maxNeg, -mo.net); });
  const W=920, L=64, R=8, topY=30, spanPos=104;
  const k = spanPos / maxPos;
  const baseY = topY + spanPos;
  const spanNeg = Math.ceil(maxNeg * k);
  const H = baseY + (maxNeg > 0 ? spanNeg : 0) + 34;
  const slot = (W-L-R)/12;
  const gridY = baseY - spanPos/2;
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;" preserveAspectRatio="xMidYMid meet">`;
  s += `<rect x="${L}" y="8" width="10" height="10" fill="#d4820a" rx="2"/><text x="${L+15}" y="17" font-size="11" fill="#6b6a65">營業收入</text>`;
  s += `<rect x="${L+84}" y="8" width="10" height="10" fill="#1b7d46" rx="2"/><text x="${L+99}" y="17" font-size="11" fill="#6b6a65">本期淨利</text>`;
  s += `<rect x="${L+176}" y="8" width="10" height="10" fill="#c0392b" rx="2"/><text x="${L+191}" y="17" font-size="11" fill="#6b6a65">淨損</text>`;
  s += `<text x="${W-R}" y="17" text-anchor="end" font-size="11" fill="#8b949e">單位：元</text>`;
  s += `<line x1="${L}" y1="${gridY}" x2="${W-R}" y2="${gridY}" stroke="#efece5" stroke-width="1" stroke-dasharray="4 4"/>`;
  s += `<line x1="${L}" y1="${baseY}" x2="${W-R}" y2="${baseY}" stroke="#d8d5cd" stroke-width="1.5"/>`;
  s += `<text x="${L-6}" y="${baseY+4}" text-anchor="end" font-size="10" fill="#8b949e">0</text>`;
  s += `<text x="${L-6}" y="${gridY+4}" text-anchor="end" font-size="10" fill="#8b949e">${fmtMoney(Math.round(maxPos/2))}</text>`;
  s += `<text x="${L-6}" y="${topY+4}" text-anchor="end" font-size="10" fill="#8b949e">${fmtMoney(maxPos)}</text>`;
  months.forEach((mo,i)=>{
    const x0 = L + i*slot, bw = Math.min(22, slot*0.3);
    const xr = x0 + slot/2 - bw - 2, xn = x0 + slot/2 + 2;
    const hR = mo.rev * k;
    if (hR > 0.5) s += `<rect x="${xr.toFixed(1)}" y="${(baseY-hR).toFixed(1)}" width="${bw.toFixed(1)}" height="${hR.toFixed(1)}" fill="#d4820a" rx="2"/>`;
    if (mo.net >= 0) {
      const hN = mo.net * k;
      if (hN > 0.5) s += `<rect x="${xn.toFixed(1)}" y="${(baseY-hN).toFixed(1)}" width="${bw.toFixed(1)}" height="${hN.toFixed(1)}" fill="#1b7d46" rx="2"/>`;
    } else {
      const hN = -mo.net * k;
      s += `<rect x="${xn.toFixed(1)}" y="${baseY}" width="${bw.toFixed(1)}" height="${hN.toFixed(1)}" fill="#c0392b" rx="2" opacity="0.85"/>`;
    }
    s += `<text x="${(x0+slot/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#8b949e">${mo.m}月</text>`;
  });
  s += `</svg>`;
  return s;
}

function kpiInsights(D) {
  const out = [];
  const add = (color, text) => out.push({ color, text });
  const m = {}; D.metrics.forEach(x => m[x.name] = x);
  const V = k => (m[k] && m[k].v !== null && m[k].v !== undefined) ? m[k].v : null;
  const p1 = v => v.toFixed(1) + '%';
  if (D.pnl.rev === 0) add('#e67e22', `${D.year} 年尚無營業收入記錄，多數指標無法評分——請先於「傳票登錄」完成記帳。`);
  if (D.pnl.net < 0) add('#c0392b', `本期稅前虧損 ${fmtMoney(-D.pnl.net)} 元，建議優先檢視毛利結構與費用管控。`);
  const gm = V('毛利率');
  if (gm !== null && gm < 10) add('#e67e22', `毛利率僅 ${p1(gm)}，低於買賣業常見水準（15～30%）——檢視進貨成本與定價策略。`);
  else if (gm !== null && gm >= 30) add('#1b7d46', `毛利率 ${p1(gm)}，優於一般買賣業水準，商品定價與成本控管得宜。`);
  if (D.expRate !== null && D.expRate > 20) add('#e67e22', `營業費用占收入 ${p1(D.expRate)}，偏高——檢視薪資、租金與行銷等固定支出。`);
  else if (D.expRate !== null && D.expRate > 0 && D.expRate <= 12) add('#1b7d46', `營業費用率 ${p1(D.expRate)}，費用控制良好。`);
  const cr = V('流動比率');
  if (cr !== null && cr < 100) add('#c0392b', `流動比率 ${p1(cr)}，低於 100%——短期償債能力不足，注意資金調度與應收催收。`);
  const qr = V('速動比率');
  if (qr !== null && qr < 60) add('#e67e22', `速動比率 ${p1(qr)}，扣除存貨後短期支付能力偏弱，建議預留安全現金部位。`);
  const dr = V('負債比率');
  if (dr !== null && dr > 70) add('#e67e22', `負債比率 ${p1(dr)}，財務槓桿偏高，建議增厚自有資金或提前償還借款。`);
  else if (dr !== null && dr <= 40) add('#1b7d46', `負債比率 ${p1(dr)}，財務結構穩健。`);
  const invT = V('存貨週轉率');
  if (invT !== null && invT < 3) add('#e67e22', `存貨週轉率僅 ${invT.toFixed(1)} 次/年（約每 ${Math.round(365/invT)} 天週轉一次）——注意呆滯庫存與進貨節奏。`);
  const arT = V('應收帳款週轉率');
  if (arT !== null && arT < 6) add('#e67e22', `應收帳款平均約 ${Math.round(365/arT)} 天收回，天數偏長——加強客戶信用管理與催收。`);
  const revG = V('營收成長率');
  if (revG !== null && revG < 0) add('#e67e22', `營收較 ${D.year-1} 年衰退 ${Math.abs(revG).toFixed(1)}%——建議檢視客戶結構與拓銷策略。`);
  else if (revG !== null && revG >= 10) add('#1b7d46', `營收較 ${D.year-1} 年成長 ${revG.toFixed(1)}%，成長動能良好。`);
  if (out.length === 0) add('#1b7d46', '各項指標均落在合理區間，整體經營穩定，維持現行節奏即可。');
  return out.slice(0, 7);
}

      <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">${g.score===null?'暫無資料':`${g.n} 項指標納入評分`}</div>
    </div>`;
  }).join('');

      <div style="font-size:11px;color:var(--text-muted);margin-top:8px;line-height:1.5;">${allNull?'尚未登錄營收或費用資料':cg.note}</div>
    </div>

        <td style="font-size:11px;color:var(--text-muted);">${m.bm}</td></tr>`;
    }
    html += `</tbody></table></div>`;
  }

  html += `<div class="report-section"><h3>智慧診斷與建議</h3><div>`;
  for (const i of kpiInsights(D)) {
    html += `<div class="kpi-insight"><span class="dot" style="background:${i.color};"></span><span>${i.text}</span></div>`;
  }
  html += `</div></div>`;

  html += `<div style="margin-top:10px;font-size:11px;color:var(--text-muted);line-height:1.8;">
    計算口徑：損益類指標採 ${D.year}/1/1～12/31 傳票；資產負債類項目以期初（上年 12/31）與期末平均計算；流動資產＝11xx 科目、流動負債＝21xx 科目、存貨＝113x、應收＝112x（含應收票據，已扣除備抵呆帳）；純益率含業外損益。指數與評分僅供經營管理參考，非法定財務報告。
  </div>`;

  html += `</div></div>`;
  return html;
}

/* ═══ HR 模組（沿用已驗證薪資邏輯）═══ */
function calcLaborInsurance(grade) {
  return Math.round(grade * 0.024);
}

function calcHealthInsurance(grade) {
  return Math.round(grade * 0.0155);
}

function calcLaborPension(baseSalary) {
  return Math.round(baseSalary * 0.06);
}

function calcTaxWithholding(grossPay, dependents) {
  // Simplified: standard deduction + salary deduction approach
  const monthlyNet = Math.max(0, grossPay - 88000 - (dependents||0)*9200);
  if (monthlyNet <= 56000) return 0;
  if (monthlyNet <= 126000) return Math.round((monthlyNet-56000)*0.05);
  if (monthlyNet <= 252000) return Math.round(3500+(monthlyNet-126000)*0.12);
  if (monthlyNet <= 472000) return Math.round(18620+(monthlyNet-252000)*0.20);
  return Math.round(62620+(monthlyNet-472000)*0.30);
}

function getInsuranceGrade(salary) {
  const m = Math.max(0, Math.floor(salary/100)*100);
  const grades = [0,1500,3000,4500,6000,7500,8700,9900,11100,12600,14100,15600,17100,18600,20100,21600,23100,24600,26100,27600,28800,30000,31800,33300,34800,36300,38200,40100,42000,43900,45800];
  for (let i=grades.length-1; i>=0; i--) { if (m >= grades[i]) return grades[i]; }
  return 0;
}

function empFull(id){const e=employees.find(x=>x.id===id);return e?e:null;}

function getYearMonth(d){const dt=new Date(d);return `${dt.getFullYear()}/${(dt.getMonth()+1).toString().padStart(2,'0')}`;}

function nowYM(){const d=new Date();return `${d.getFullYear()}${(d.getMonth()+1).toString().padStart(2,'0')}`;}

function saveEmployee(){
  const code=document.getElementById('eCode').value.trim();
  const name=document.getElementById('eName').value.trim();
  if(!code||!name) return alert('請填寫編號與姓名');
  const data={id:STATE.editingId||genId(),code,name,
    idNumber:document.getElementById('eIdNo').value,gender:document.getElementById('eGender').value,
    birthDate:document.getElementById('eBirth').value,hireDate:document.getElementById('eHire').value,
    dept:document.getElementById('eDept').value,title:document.getElementById('eTitle').value,
    phone:document.getElementById('ePhone').value,email:document.getElementById('eEmail').value,
    addr:document.getElementById('eAddr').value,bankAcct:document.getElementById('eBank').value,
    status:document.getElementById('eStatus').value,leaveDate:document.getElementById('eLeaveDate')?document.getElementById('eLeaveDate').value:''};
  if(STATE.editingId){const i=employees.findIndex(x=>x.id===STATE.editingId);if(i>=0)employees[i]=data;}
  else{employees.push(data);}
  save('employees',employees);closeModal();renderPage();
}

function deleteEmployee(id){
  if(!confirm('確定刪除此員工？'))return;
  employees=employees.filter(x=>x.id!==id);
  save('employees',employees);renderPage();
}

function renderOrgChart(){
  let h=`<div class="card"><div class="card-header"><h2>組織架構圖</h2><span style="font-size:12px;color:var(--text-muted);">依部門與職稱階層</span></div><div class="card-body">`;

  // Build tree by department -> title hierarchy
  const titleOrder = [...ALL_TITLES];
  for(const dept of DEPTS){
    const deptEmps = employees.filter(e=>e.dept===dept&&e.status==='在職');
    if(deptEmps.length===0) continue;
    h+=`<div class="section-title">${dept}（${deptEmps.length}人）</div>`;
    // Sort by title hierarchy
    deptEmps.sort((a,b)=>titleOrder.indexOf(a.title)-titleOrder.indexOf(b.title));
    let lastTitle='';
    for(const e of deptEmps){
      const levelIdx = titleOrder.indexOf(e.title);
      const levelClass = levelIdx<=1?'level-0 level-1':(levelIdx<=3?'level-2':'level-3');
      if(e.title!==lastTitle){
        h+=`<div class="org-level ${levelClass}" style="font-weight:600;margin-top:6px;">📌 ${e.title}</div>`;
        lastTitle=e.title;
      }
      h+=`<div class="org-level ${levelClass}" style="margin-left:24px;">${e.code} ${e.name} — ${e.phone}</div>`;
    }
  }

  h+=`</div></div>`;
  return h;
}

function renderOvertime(){
  let h=`<div class="card"><div class="card-header"><h2>加班記錄</h2>
    <button class="btn btn-primary" onclick="showOvertimeModal()">＋ 新增加班</button></div><div class="card-body">`;

  if(overtimes.length===0){
    h+=`<div style="text-align:center;padding:30px;color:var(--text-muted);">尚無加班記錄</div>`;
  } else {
    h+=`<table class="data-table"><thead><tr><th>日期</th><th>員工</th><th>加班類型</th><th>時數</th><th>加班費</th><th>備註</th><th></th></tr></thead><tbody>`;
    for(const o of [...overtimes].reverse()){
      const emp=empFull(o.employeeId);
      const sal=salaryStructures.find(s=>s.employeeId===o.employeeId);
      const hourRate=sal?Math.round(sal.baseSalary/30/8):0;
      // Taiwan overtime rate: first 2hr x1.34, 2-4hr x1.67
      const otPay=o.hours<=2?Math.round(o.hours*hourRate*1.34):Math.round(2*hourRate*1.34+(o.hours-2)*hourRate*1.67);
      h+=`<tr><td>${fmtDate(o.date)}</td><td>${empName(o.employeeId)}</td><td><span class="badge badge-warning">${o.type}</span></td><td class="num">${o.hours}h</td><td class="num">${fmtMoney(otPay)}</td><td>${o.note||''}</td><td style="text-align:right;"><button class="btn btn-danger btn-xs" style="${isFree()?'display:none;':''}" onclick="deleteOvertime('${o.id}')">刪除</button></td></tr>`;
    }
    h+=`</tbody></table>`;
  }
  h+=`</div></div>`;
  return h;
}

  for(const emp of employees.filter(e=>e.status==='在職')){

  }
  h+=`</tbody></table></div></div>`;
  return h;
}

function generatePayroll(){
  const ymInput=document.getElementById('payYM')?.value;
  if(!ymInput) return;
  const ymKey=ymInput.replace('-','');
  // Remove existing records for this month
  payrollRecords=payrollRecords.filter(p=>p.yearMonth!==ymKey);

  for(const emp of employees.filter(e=>e.status==='在職')){
    const sal=salaryStructures.find(s=>s.employeeId===emp.id);
    if(!sal) continue;
    const allowances=sal.positionAllowance+sal.mealAllowance+sal.otherAllowance;
    // Calculate overtime for this month
    const monthOvertimes=overtimes.filter(o=>{
      const m=getYearMonth(o.date).replace('/','');
      return o.employeeId===emp.id && m===ymKey;
    });
    let overtimePay=0;
    const hourRate=Math.round(sal.baseSalary/30/8);
    for(const o of monthOvertimes){
      overtimePay+=o.hours<=2?Math.round(o.hours*hourRate*1.34):Math.round(2*hourRate*1.34+(o.hours-2)*hourRate*1.67);
    }

    const grossPay=sal.baseSalary+allowances+overtimePay;
    const insGrade=getInsuranceGrade(sal.baseSalary);
    const laborInsurance=calcLaborInsurance(insGrade);
    const healthInsurance=calcHealthInsurance(insGrade);
    const laborPension=calcLaborPension(sal.baseSalary); // employer portion (for reference)
    const taxWithholding=calcTaxWithholding(grossPay,1);
    const netPay=grossPay-laborInsurance-healthInsurance-taxWithholding;

    payrollRecords.push({id:genId(),employeeId:emp.id,yearMonth:ymKey,
      baseSalary:sal.baseSalary,allowances,overtimePay,grossPay,
      laborInsurance,healthInsurance,laborPension,taxWithholding,netPay});
  }
  save('payrollRecords',payrollRecords);
  renderPage();
}

function hasModule(m){ return !!TF().modules[m]; }

/* ── License engine（相容舊 ERP 金鑰 code=1 與 HR 金鑰 code=2）── */
const LICENSE_SECRET = "Taiwan…Claw";
const PRODUCT_CODES = [1, 2];
async function verifyLicenseAsync(key, company) {
  if (!key || !company) return { valid:false, reason:'請輸入金鑰與公司名稱' };
  const parts = key.trim().split('-');
  if (parts.length !== 4) return { valid:false, reason:'金鑰格式錯誤（需為 XXXX-XXXX-XXXX-XXXX）' };
  const h = (parts[0] + parts[1] + parts[2]).toUpperCase();
  const expiry = parts[3];
  for (const CODE of PRODUCT_CODES) {
    for (let tier = 1; tier <= 3; tier++) {
      const body = new TextEncoder().encode(`${CODE}|${tier}|${company}|${expiry}|${LICENSE_SECRET}`);
      const hashBuffer = await crypto.subtle.digest('SHA-256', body);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
      if (hashHex.startsWith(h)) {
        if (expiry !== '999999') {
          const ey = parseInt('20' + expiry.slice(0, 2));
          const em = parseInt(expiry.slice(2, 4)) - 1;
          const ed = parseInt(expiry.slice(4, 6));
          const expDate = new Date(ey, em, ed);
          if (new Date() > expDate) return { valid:false, reason:'授權已過期（' + expDate.toLocaleDateString('zh-TW') + '）' };
        }
        return { valid:true, tier, tierName:TIER_NAMES[tier], company, key, expiry: expiry === '999999' ? '永久' : expiry };
      }
    }
  }
  return { valid:false, reason:'金鑰無效，請確認金鑰與公司名稱正確' };
}

/* ── Data layer（統一 DB + 舊系統遷移）── */
const DB_NAME = 'ERP_SUITE_DB';
const DB_VERSION = 1;
const STORES = ['accounts','journalEntries','products','suppliers','customers','purchaseOrders','salesOrders',
                'users','license','openingBalances','openingDate',
                'employees','salaryStructures','attendances','leaves','overtimes','payrollRecords'];
let _db = null;
function openDB() {
  return new Promise((resolve, reject) => {
    if (_db) return resolve(_db);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath:'id' });
    };
    req.onsuccess = (e) => { _db = e.target.result; resolve(_db); };
    req.onerror = (e) => reject(e.target.error);
  });
}
async function dbLoad(storeName) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}
async function dbSave(storeName, data) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    store.clear();
    (data || []).forEach(d => store.put(d));
    tx.oncomplete = () => resolve();
  });
}
async function load(key, fallback) {
  try {
    const d = await dbLoad(key);
    if (d && d.length > 0) return d;
  } catch (e) {}
  try {
    const v = localStorage.getItem('suite_' + key);
    if (v) { const d = JSON.parse(v); if (d && d.length > 0) { await dbSave(key, d); localStorage.removeItem('suite_' + key); return d; } }
  } catch (e) {}
  return fallback;
}
async function save(key, data) { try { await dbSave(key, data); } catch (e) {} }
async function legacyRead(name, store) {
  let db = null;
  try {
    db = await new Promise((res, rej) => {
      const rq = indexedDB.open(name);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
    if (!db.objectStoreNames.contains(store)) return [];
    return await new Promise((res) => {
      const tx = db.transaction(store, 'readonly');
      const rq = tx.objectStore(store).getAll();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => res([]);
    });
  } catch (e) { return []; }
  finally { try { if (db) db.close(); } catch (e) {} }
}
async function legacyMigrate() {
  const plan = [['ERP_DB', ['license','accounts','journalEntries','products','suppliers','customers','purchaseOrders','salesOrders','users','openingBalances','openingDate']],
                ['HR_DB',  ['license','employees','salaryStructures','attendances','leaves','overtimes','payrollRecords']]];
  for (const [name, stores] of plan) {
    for (const s of stores) {
      try {
        const rows = await legacyRead(name, s);
        if (!rows || rows.length === 0) continue;
        const cur = await load(s, []);
        if (!cur || cur.length === 0) await dbSave(s, rows);
      } catch (e) {}
    }
  }
}

/* ── 跨模組自動傳票 ── */
function accIdByCode(code, prefix) {
  const a = accounts.find(x => x.code === code) || accounts.find(x => x.code.startsWith(prefix));
  return a ? a.id : null;
}
function postVoucher(date, desc, entries) {
  const d = new Date(date);
  const prefix = `${d.getFullYear() - 1911}${(d.getMonth() + 1).toString().padStart(2, '0')}${d.getDate().toString().padStart(2, '0')}`;
  const sameDay = journalEntries.filter(j => j.voucher && j.voucher.startsWith(prefix + '-')).length;
  let seq = sameDay + 1;
  while (journalEntries.some(j => j.voucher === `${prefix}-${String(seq).padStart(3, '0')}`)) seq++;
  const voucher = `${prefix}-${String(seq).padStart(3, '0')}`;
  const lines = entries.filter(e => e.debit > 0 || e.credit > 0);
  const dr = lines.reduce((s, l) => s + l.debit, 0);
  const cr = lines.reduce((s, l) => s + l.credit, 0);
  if (Math.abs(dr - cr) > 0.5) return { ok:false, msg:`借貸不平（借 ${fmtMoney(dr)} / 貸 ${fmtMoney(cr)}）` };
  const je = { id:genId(), date, voucher, desc:'[自動] ' + desc, lines };
  journalEntries.push(je);
  save('journalEntries', journalEntries);
  return { ok:true, voucher };
}
function postSalesVoucher(soId) {
  if (!hasFeature('integration')) return alert('此功能屬專業版以上');
  const so = salesOrders.find(x => x.id === soId); if (!so) return;
  const total = so.lines.reduce((s, l) => s + l.qty * l.price, 0);
  const cogs = so.lines.reduce((s, l) => { const p = products.find(x => x.id === l.prod); return s + (p ? p.cost * l.qty : 0); }, 0);
  const ar = accIdByCode('1123', '112'), rev = accIdByCode('4101', '4'), cg = accIdByCode('5109', '51'), inv = accIdByCode('1131', '113');
  if (!ar || !rev) return alert('找不到應收帳款（1123）或銷貨收入（4101）科目');
  const entries = [
    { acc:ar, debit:total, credit:0 },
    { acc:rev, debit:0, credit:total },
  ];
  if (cogs > 0 && cg && inv) entries.push({ acc:cg, debit:cogs, credit:0 }, { acc:inv, debit:0, credit:cogs });
  const r = postVoucher(so.date, '銷貨傳票 ' + (so.soNo || ''), entries);
  if (r.ok) { alert('已產生銷貨傳票 ' + r.voucher + (cogs > 0 ? '\n含銷貨成本 ' + fmtMoney(cogs) + ' 元' : '')); renderPage(); }
  else alert(r.msg);
}
function postPurchaseVoucher(poId) {
  if (!hasFeature('integration')) return alert('此功能屬專業版以上');
  const po = purchaseOrders.find(x => x.id === poId); if (!po) return;
  const total = po.lines.reduce((s, l) => s + l.qty * l.price, 0);
  const inv = accIdByCode('1131', '113'), ap = accIdByCode('2122', '212');
  if (!inv || !ap) return alert('找不到商品（1131）或應付帳款（2122）科目');
  const r = postVoucher(po.date, '進貨傳票 ' + (po.poNo || ''), [
    { acc:inv, debit:total, credit:0 },
    { acc:ap, debit:0, credit:total },
  ]);
  if (r.ok) { alert('已產生進貨傳票 ' + r.voucher); renderPage(); }
  else alert(r.msg);
}
function postPayrollVoucher() {
  if (!hasFeature('integration')) return alert('此功能屬專業版以上');
  const ymInput = document.getElementById('payYM')?.value;
  if (!ymInput) return alert('請先選擇薪資月份');
  const ymKey = ymInput.replace('-', '');
  const recs = payrollRecords.filter(p => p.yearMonth === ymKey);
  if (recs.length === 0) return alert('此月份尚無薪資記錄，請先產生薪資');
  const tag = '薪資傳票 ' + ymKey;
  if (journalEntries.some(j => j.desc && j.desc.includes(tag))) return alert('此月份薪資傳票已產生過（傳票登錄可查 [自動] ' + tag + '）');
  const gross = recs.reduce((s, p) => s + p.grossPay, 0);
  const net = recs.reduce((s, p) => s + p.netPay, 0);
  const wh = recs.reduce((s, p) => s + p.laborInsurance + p.healthInsurance + p.taxWithholding, 0);
  const exp = accIdByCode('6101', '61'), bank = accIdByCode('1112', '111'), other = accIdByCode('2129', '212');
  if (!exp || !bank) return alert('找不到薪資支出（6101）或銀行存款（1112）科目');
  const entries = [
    { acc:exp, debit:gross, credit:0 },
    { acc:bank, debit:0, credit:net },
  ];
  if (wh > 0 && other) entries.push({ acc:other, debit:0, credit:wh });
  const y = ymKey.slice(0, 4), mo = ymKey.slice(4);
  const date = `${y}-${mo}-${new Date(Number(y), Number(mo), 0).getDate()}`;
  const r = postVoucher(date, tag, entries);
  if (r.ok) { alert('已產生薪資傳票 ' + r.voucher + '\n借 薪資支出 ' + fmtMoney(gross) + '／貸 銀行存款 ' + fmtMoney(net) + '＋代扣款 ' + fmtMoney(wh)); renderPage(); }
  else alert(r.msg);
}

/* ── 人力指標指數分析（V3.0）── */
function hrScore(v, best, worst, hi) {
  if (v === null || v === undefined || isNaN(v)) return null;
  let s = hi ? (v - worst) / (best - worst) : (worst - v) / (worst - best);
  return Math.max(0, Math.min(100, Math.round(s * 100)));
}
function statutoryAnnualLeave(ty) {
  if (ty < 1) return 3 * ty;
  if (ty < 2) return 7;
  if (ty < 3) return 10;
  if (ty < 5) return 14;
  if (ty < 10) return 15;
  return Math.min(30, 15 + Math.floor(ty) - 10 + 1);
}
function hrCompositeGrade(s) {
  if (s >= 80) return { label:'優良', color:'#1b7d46', note:'人員穩定、紀律與負荷均衡，人力體質健全。' };
  if (s >= 65) return { label:'穩健', color:'#4a9d5f', note:'整體良好，少數指標仍有改善空間。' };
  if (s >= 50) return { label:'尚可', color:'#d4820a', note:'營運可用，建議針對弱項指標優先改善。' };
  if (s >= 35) return { label:'待改善', color:'#e67e22', note:'多項人力指標偏弱，注意流動率與負荷。' };
  return { label:'風險', color:'#c0392b', note:'人力風險偏高，建議檢視留才與工時管理。' };
}

  if (!company) { document.getElementById('licError').textContent = '請輸入公司名稱'; return; }
  if (!key) { document.getElementById('licError').textContent = '請輸入授權金鑰'; return; }
  const result = await verifyLicenseAsync(key, company);
  if (!result.valid) { document.getElementById('licError').textContent = result.reason; return; }
  STATE.license = { id:'license', company:result.company, key:result.key, tier:result.tier, tierName:result.tierName, expiry:result.expiry };
  await save('license', [STATE.license]);
  closeModal(); updateLicenseDisplay(); renderPage();
}
function updateLicenseDisplay() {
  const ver = document.getElementById('sidebarVer');
  const lic = document.getElementById('sidebarLicense');
  const tier = STATE.license ? STATE.license.tier : 1;
  if (ver) ver.textContent = `${TIER_NAMES[tier]} ${APP_VERSION}`;
  if (lic) {
    if (STATE.license) {
      const badge = tier >= 2 ? '<span style="background:#1b7d46;color:#fff;padding:1px 6px;border-radius:3px;font-size:10px;">專業版</span>' : '<span style="background:#d4820a;color:#fff;padding:1px 6px;border-radius:3px;font-size:10px;">免費版</span>';
      lic.innerHTML = badge + ' ' + (STATE.license.company || '');
      lic.style.display = '';
    } else { lic.textContent = '授權：未啟用'; }
  }
  document.querySelectorAll('.nav-item[data-hr]').forEach(el => {
    const locked = !hasModule('hr');
    el.classList.toggle('locked', locked);
    const lk = el.querySelector('.nav-lock');
    if (lk) lk.style.display = locked ? '' : 'none';
  });
}

/* ── Global listeners ── */
document.getElementById('sidebarNav').addEventListener('click', (e) => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  $$('.nav-item').forEach(el => el.classList.remove('active'));
  item.classList.add('active');
  STATE.currentPage = item.dataset.page;
  renderPage();
});
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !document.getElementById('modalOverlay').classList.contains('hidden')) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
      const btn = document.querySelector('#modalBox .modal-footer .btn-primary');
      if (btn) btn.click();
    }
  }
});
setInterval(() => {
  const now = new Date();
  const hd = document.getElementById('headerDate');
  const sc = document.getElementById('sidebarClock');
  if (hd) hd.textContent = now.toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit', weekday:'short' });
  if (sc) sc.textContent = now.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
}, 1000);

/* ── Init ── */
(async function init() {
  try {
    await openDB();
    await legacyMigrate();
    accounts = await load('accounts', DEFAULT_ACCOUNTS);
    journalEntries = await load('journalEntries', []);
    products = await load('products', []);
    suppliers = await load('suppliers', []);
    customers = await load('customers', []);
    purchaseOrders = await load('purchaseOrders', []);
    salesOrders = await load('salesOrders', []);
    users = await load('users', DEFAULT_USERS);
    employees = await load('employees', DEFAULT_EMPLOYEES);
    salaryStructures = await load('salaryStructures', DEFAULT_SALARIES);
    attendances = await load('attendances', []);
    leaves = await load('leaves', []);
    overtimes = await load('overtimes', []);
    payrollRecords = await load('payrollRecords', []);
    await loadOpeningBalances();
    const saved = await load('license', []);
    if (saved && saved.length > 0) {
      const l = saved[0];
      if (l.tier === 1 || (l.key && l.key.startsWith('FREE'))) {
        STATE.license = { valid:true, tier:1, tierName:'免費版', company:l.company || '免費試用', key:l.key || 'FREE', expiry:'永久' };
      } else {
        const r = await verifyLicenseAsync(l.key, l.company);
        STATE.license = r.valid ? r : null;
      }
    }
  } catch (e) {
    accounts = DEFAULT_ACCOUNTS; users = DEFAULT_USERS; employees = DEFAULT_EMPLOYEES; salaryStructures = DEFAULT_SALARIES;
  }
  updateLicenseDisplay();
  renderPage();
})();

</script>
</body>
